# Ключи книги прохода ядра 9 (core9-spec, 28.10.2026) — значения для потока книги / интеграции круга 11. Решения ведущего № 11:
# Р11-1, Р11-2, Р11-3. Числа — обзор круга 11 (stage1/round11/sweep) с правками методики (ПРАВКА МЕТОДИКИ — ниже). Прототип —
# _wt/spec9 @ 58397c7 (не реализация); пробы — runs/*.rederive.txt, run_prices.json. ПРЕДВАРИТЕЛЬНО, 600 прогонов, общие числа круга 4.

nii:
  books:
    # Р11-1, класс 6, тип Б (совместный подбор calib-nii/out/backtest.json → joint.a): доля сжатия спреда книги к опоре между
    # мирами = наклон модели без ключа − наклон совместного подбора. Поле ставится ТОЛЬКО книгам с долей ≠ 0 (0 и нет поля — одна
    # ветвь, бит в бит); тип каждой книги (в т. ч. с 0) — в class_checks.yaml, блок book_slopes.
    cards:      {phi_share: 0.658}     # 1 − 0,3417 (наклон к key; границы подбора листа 0…0,35 — верх рядом)
    liquidity:  {phi_share: 0.1419}    # 1 − 0,8581
    mortgage:   {phi_share: 0.0246}    # 1 − 0,9754
    # Φ_A — форма отклонения: share_b = (1 − a_b) − Σ_ω (1 − a), ω — доли якоря Φ_A (0,1281 / 0,8719); Σ ω share = 0 (прототип
    # 6e-6 из-за округления записи). Среднее сжатие Φ_A — φ_A решателя (тип В, ось φ), отклонение книги — тип Б.
    cash_loans: {phi_share: 0.3472}    # (1 − 0,4486) − 0,2042
    corp_loans: {phi_share: -0.0510}   # (1 − 0,8468) − 0,2042
    # auto, securities — 0 (подбор 1,0 = модель): поля нет.
    # retail_current, retail_term, corp_term, corp_current — 0 по обзору («φ_L сверх β — законно»); МЕТОДИКА: законной связи в
    #   уставе §8 нет, бэктест §5 1(б) на наклонах модели на ней проваливается — КРАСНЫЙ ФЛАГ 2, решение ведущего.
    # wholesale — 0 по обзору «до решения ведущего»; МЕТОДИКА: перевывод С ОСТАЛЬНЫМИ ДОЛЯМИ сходится и при 0,2477 (отказ обзора —
    #   проба одного опта) — КРАСНЫЙ ФЛАГ 1, решение ведущего (тип Б 0,2477 или тип В на прочтениях 0 … 0,2477 / 0,3546).
    # insurance_liab — 0 (β 0,65 решением № 1, п. 6; совместного подбора нет).

volumes:
  funds_scope: clients                 # Р11-2 (класс 1): база структурного опта К3, якорь доли опта, слово funds баз строк — средства
                                       # клиентов без книги К6 (одно слово — одна величина с checks.client_funds: clients, Р11-10)
  wholesale_structural_to_funds: 0.0969   # тип В: середина (101,964 + 46,805) / 3 236,582 = 0,045965 … 478,227 / 3 236,582 = 0,147757

valuation:
  uncertainty:
    axes_edit:
      - {name: "Опт: структурная доля к средствам клиентов (К3)", paths: [volumes.wholesale_structural_to_funds],
         low: 0.0460, high: 0.1477}    # ПРАВКА МЕТОДИКИ: верх 0,1477 (вниз до 4 знаков), НЕ 0,1478 — ядро отказывает при s > доли
                                       # якоря 0,147757 (BookError, проверено: run_* / флаг 4); подпись оси — «к средствам клиентов»
  reference_variants_edit:
    - {id: wholesale_anchor_share, overrides: {volumes.wholesale_structural_to_funds: 0.1477}}   # то же правило 4 знаков вниз
    - {id: wholesale_structural_low, overrides: {volumes.wholesale_structural_to_funds: 0.0460}}
    - {id: clients_all, overrides: {checks.client_funds: all, volumes.funds_scope: all}}         # Р11-10: развилка — ОБА ключа
    - {id: insurance_liab_as_funds, note: "К6 выключен → funds_scope неактивен (средства — все книги); s этого варианта —
       на средствах с книгой страховых (0,092 прежнего центра), иначе база и s на разных величинах (класс 4); цена — forks_rd"}
  reference_variants_new:
    - {id: nci_real_rubles, title: "Неконтролирующие в реальных рублях (Σ НДУ окна 3К2025–2К2026 с долей группы в Б2Б-РТС, цены 2026)",
       overrides: {pnl.nci_real: {LT: 4.82}}, print: forks_rd}    # Р11-3; цена сухим перевыводом (Р11-6): +0,9326 / +0,9125 на книге
                                                                  # круга 11 с ключами (allnci), терминал — формой рублей (класс 3)
    - {id: cards_slope_mid, title: "«Халва»: наклон к ключевой — середина способов подбора (0,239)",
       overrides: {nii.books.cards.phi_share: 0.761}, print: forks_rd}   # Р11-1 развилка: +0,0374 / +0,0425 (cardsmid против all)

pnl:
  nci_share: 0.0655                    # центр прежний (тип А); комментарий — числа круга 11 (Р11-7), не прежних кругов

# Комментарии шаблона, которые переписать (Р11-7, класс 4): cards — «φ не сжимается…» → «доля сжатия между мирами 0,658 (Р11-1):
# наклон к ключевой между мирами 0,342 = совместный подбор»; liquidity, mortgage — то же со своими числами; cash_loans, corp_loans —
# «отклонение от среднего Φ_A»; volumes.wholesale_to_funds — «опт / средства клиентов 478,227 / 3 236,582 = 0,147757 (якорь; ряд на
# той же величине)»; К3 — «к средствам клиентов» (было «средства ядра … 3 407,692»); МОDEL §4.4 строка «ядро держит наклон 1 к опоре».
