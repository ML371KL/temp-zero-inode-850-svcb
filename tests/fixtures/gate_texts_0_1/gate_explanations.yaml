# Письменные объяснения сработавших гейтов правдоподобия — книга Совкомбанка 0.1 (MODEL §14.2; читает model/checks.py).
#
# Правило семейства: гейт — не ошибка, а место, где модель расходится с историей, ориентирами или рынком; расходиться
# можно, не замечать — нельзя. Сработавший гейт без объяснения — находка для проверки экономики, а не для подгонки:
# объяснение пишется после проверок экономики (PLAYBOOK §2–§2а) и только когда они сочли срабатывание свойством книги.
# Сборку выпуска роняет (код 1) сработавший гейт без действующего объяснения: нет записи, истёк срок (valid_until
# действует включительно) или масса вне коридора 0,4 × lo − 0,02 … 1,5 × hi + 0,02.
#
# Круг 5 (22.10.2026; решения ведущего № 5, Р5-7, Р5-8): объяснения по существу — числами сетки книги круга 5 (перевывод
# r5-r2: база страхования по месту выручки, разовые расходы ХКФ 3,86) и причинами из двух проверок экономики круга 4
# (econ4-blind, econ4-classes: знак объёмных эффектов и предельная экономика мира M — сжатие спредов передачей ставки и
# беспроцентные деньги К8; знак стресса — предпосылка гейта; ограничение капиталом). Калибровка ради гейтов не менялась.
# Гейт pb_by_world сработал впервые на книге круга 5 (база страхования по месту выручки сняла часть стоимости клеток
# мира M: P/B клетки M/кризис/жёсткий 0,207 → 0,194) — объяснение записано, ВНИМАНИЕ ведущему. Гейт wholesale_share после
# переноса порога по правилу листа (Р5-11) молчит — записи нет (запись тихого гейта снимается).
#
# ТЕКСТ ОБЪЯСНЕНИЯ ПЕЧАТАЕТ ВИТРИНА — он пишется словами для владельца (PAYLOAD §0.2): без имён ключей и полей, без
# ссылок на листы и файлы; доли — в процентах, разности долей — в п.п., даты — с годом. Миры ставок: «Нормализация
# ставок», «Высокие ставки надолго», «Рыночный как есть»; режимы: «Мягкая посадка», «Нормализация», «Розничный спад»,
# «Кризис»; сценарии требований к капиталу: «По графику», «АЦН 1 % и консолидация страховщиков», «Жёсткий». Масса —
# вероятность нарушивших клеток слоя «Свой макро-взгляд» (у гейта знака стресса — под вероятностями точки). Все записи
# живут до перезаякоривания книги на отчётность МСФО за третий квартал 2026 года (не позже 30.11.2026).
#
# Круг 8 (22.10.2026; решения ведущего № 8, Р8-7): объяснение stress_sign переписано числами книги круга 8 (перевывод b8-r1):
# масса 0,074 под вероятностями точки (0,140 под весами слоя «свой взгляд»), 8 клеток; нарушения знака стоимости — две пары
# M/«Розничный спад» (+0,76 и +0,55 млрд ₽; механизм Р5-7 — предельный кредит мира M ниже k); пары M/«Мягкая посадка» круга 7
# (+7,66 млрд ₽) на книге круга 8 нет. Числа в объяснениях прочих гейтов — круга 5 (тексты — медленный круг); массы всех
# сработавших гейтов — в коридорах объяснений.
#
# Формат записи:
#   <гейт>:
#     explanation: >-
#       ...
#     expected_mass: 0.045
#     valid_until: 2026-11-30
#
# Круг 9 (27.10.2026; решения ведущего № 9, Р9-6; поток integrate9): объяснения всех сработавших гейтов переписаны числами книги
# круга 9 (перевывод i9-w3: Р9-1 — корень номинальной части книги страховых, Р9-2 — нужда премии средств на ожидании слоя,
# Р9-4, Р9-5; числа — stage1/round9/integrate/gates_r9.json). Запись pb_by_world снята — гейт на книге круга 9 молчит.
# Добавлено объяснение ручного входа manual_input_overdue: миры старше заседания Банка России 23.10.2026 — гейт молчит до
# 13.11.2026 включительно (21 день) и срабатывает с 14.11.2026, пока семейство не выпустит новую запись миров (Сбер, Т, ВТБ
# стоят на записи 21.09.2026); срок — как у Т, 30.11.2026.
#
# Круг 10 (28.10.2026; решения ведущего № 10; поток integrate10): объяснения всех сработавших гейтов переписаны числами книги
# круга 10 (перевывод i10-w2: правки книги Р10-1…Р10-4 и Р10-15; ключи прохода ядра 8 — франшиза и книга страховых формой
# строки, гейт стоимости средств на ожидании мира, гейты на средствах клиентов без книги страховых; числа —
# stage1/round10/integrate/gates_r10.json). Масса stress_sign выросла с 4,7 до 9,3 % (8 клеток вместо 5) — запись
# переписана; capital_gap — 10 клеток (добавилась M/«Розничный спад»/«Жёсткий», один квартал); growth_cut — 3 клетки.
# manual_input_overdue — новой записи миров семейства нет (Сбер, Т, ВТБ стоят на записи 21.09.2026); срок прежний.
#
# Круг 11 (28.10.2026; решения ведущего № 11; поток integrate11): объяснения всех сработавших гейтов переписаны числами книги
# круга 11 (перевывод i11-final: правки книги № 11 — дрейф плотности RWA, κ без 2018 года, LT-спред опта и мелкие центры; ключи
# прохода ядра 9 — доли сжатия книг ЧПД между мирами, средства клиентов в балансовой механике; числа —
# stage1/round11/integrate/gates_r11.json). Масса stress_sign снизилась с 9,3 до 6,8 % (6 клеток вместо 8: клетки мира
# «Рыночный как есть» выпали — предельный кредит мира окупает капитал лучше, 10,3 % против 8,1 %); volume_sign −0,44 → −0,35 ₽.
# manual_input_overdue — новой записи миров семейства нет (Сбер, Т, ВТБ стоят на записи 21.09.2026, проверено чтением
# worlds_source.json трёх моделей 28.10.2026); срок прежний.
#
# fix11 (28.10.2026; доделка решений № 11 без ядра: уровень страхования — тип А, доля сжатия опта 0,2477, статистики окон М13 и
# запас менеджмента — тип А, пути CoR без 2016 и 2018 годов; перевывод f11-final, числа — var/f11/gates_f11.json): переписаны
# объяснения гейтов, у которых изменились числа, — volume_sign (−0,35 → −0,14 ₽), stress_sign (6,8 → 6,9 %, семь пар вместо
# шести), growth_cut (2,4 → 0,8 %). Числа nim_path_joint, capital_gap, m_crisis_vs_cbr, step_dividend — прежние.
#
# Круг 12 (28.10.2026; решения ведущего № 12; поток book12, перевывод r12-final, числа — var/r12/gates_r12.json и pb_cells.json):
# объяснения всех сработавших гейтов переписаны числами книги круга 12 — уровни расходов, комиссий и страхования к базе — тип В
# (середина 2П2026 и окна R, Р12-1, Р12-2), доля φ на границе области гейтов (Р12-4), вероятности режимов без 2016 и 2018 годов
# (Р12-6). Сработал гейт pb_by_world (пять клеток мира «Рыночный как есть», 5,8 %) — запись добавлена; масса growth_cut выросла с
# 0,8 до 3,7 % (четыре клетки) — запись переписана. manual_input_overdue — новой записи миров семейства нет: Сбер, Т и ВТБ стоят на
# записи 21.09.2026 (проверено чтением worlds_source.json трёх моделей 28.10.2026); срок прежний.
#
# Круг 12, раздел И (28.10.2026; решения ведущего № 12, поправки 28.10; поток amend12, перевывод r12c-final, числа —
# var/r12c/gates_r12c.json и pb_cells.json): объяснения всех сработавших гейтов переписаны числами итоговой книги круга 12 —
# второе прочтение уровней расходов, комиссий и страхования — уровень года якоря целиком (Р12-1а: страхование к базе 2,23 %
# вместо 2,16 %, комиссии 1,49 % вместо 1,57 %, расходы 2,34 % вместо 2,40 %), центр премии средств на новой нужде (Р12-12).
# Сработали те же 8 гейтов; pb_by_world — три клетки вместо пяти (3,0 % вместо 5,8 %), прочие массы прежние.
# manual_input_overdue — новой записи миров семейства нет: Сбер, Т и ВТБ стоят на записи 21.09.2026 (проверено чтением
# worlds_source.json трёх моделей 28.10.2026, поле asof); срок прежний.
#
# Медленный круг (29.10.2026; числа те же): сняты сравнения с прежней книгой (volume_sign, stress_sign, growth_cut,
# pb_by_world) — на экране нет меток круга; step_dividend называет Н1.0 якоря до и после вычета дивиденда за 2025 год.

volume_sign:
  explanation: >-
    Гейт проверяет знак объёмных эффектов: если снять остановку кредита в кризисе (рост кредита 2,5 % в 2027 году и 4,5 % в
    2028 году по рисковому сценарию Банка России вместо роста мира) и поправки роста режимов (+1,5 п.п. в «Мягкой посадке» и
    −3 п.п. в «Розничном спаде» в 2027–2028 годах, +1,5 п.п. в «Кризисе» в 2029 году), оценка не должна падать, а цена мира
    «Рыночный как есть» — меняться хуже цены мира «Высокие ставки надолго». Проверка идёт при выключенном ограничении роста
    капиталом. У книги оценка падает на 0,17 ₽ (14,44 → 14,27 ₽); по мирам: −0,28 ₽ в мире «Нормализация ставок», −0,29 ₽ в
    мире «Высокие ставки надолго», −0,09 ₽ в мире «Рыночный как есть». Большую часть падения даёт кредит в кризисе без
    остановки: −0,14 ₽ по точке (миры −0,23 / −0,26 / −0,07 ₽) — лишний рост кредита в год шока идёт при стоимости риска
    кризиса 4,6–4,7 % и требовании, растущем к ступени 2028 года, и капитал на него стоит дороже, чем он приносит, в каждом
    мире. Лишний рост в «Розничном спаде» стоит −0,05 ₽ (−0,09 / −0,09 / −0,02 ₽), снятые надбавки «Мягкой посадки» и
    «Кризиса» — +0,015 ₽. Предельная единица корпоративного бизнеса (кредит юрлицу со средствами юрлиц и гарантиями в отношении
    сегмента) в 2036 году окупает капитал на 14,5 % после налога в мире «Нормализация ставок» при стоимости капитала 14,1 %, на
    12,9 % при 17,8 % в мире «Высокие ставки надолго» и на 9,2 % при 21,8 % в мире «Рыночный как есть»: в двух мирах из трёх
    рост кредита стоимость снижает и вне кризиса. Это свойство миров и кризисного года, а не ошибка калибровки. Калибровка
    ради гейта не менялась.
  expected_mass: 1.0
  valid_until: 2026-11-30
stress_sign:
  explanation: >-
    Гейт проверяет знаки стресса двумя опытами. Первый — разовый убыток кризиса больше на 30 млрд ₽ — выполнен: стоимость ни
    одной клетки кризиса не растёт, на рубль убытка после налога она снижается на 0,33–0,86 ₽. Второй — при более высоком
    требовании к капиталу прибыль акционеров последнего года сетки (2036) не должна быть выше — нарушен в шести клетках
    сценария «Жёсткий» (6,8 % вероятности точки): в «Мягкой посадке», «Нормализации» и «Розничном спаде» миров «Нормализация
    ставок» и «Высокие ставки надолго» — против сценария «АЦН 1 % и консолидация страховщиков», у «Нормализации» мира
    «Нормализация ставок» — и против «По графику». Прибыль выше на 0,4–4,0 млрд ₽ (больше всего — «Высокие ставки надолго»,
    «Мягкая посадка»). Это свойство мерки, а не оценки: жёсткий сценарий держит больше капитала, кредитов у него меньше, и доход
    на лишний капитал поднимает прибыль года, а стоимость клетки во всех семи парах ниже — на 14,3–22,6 млрд ₽. Стоимость
    клетки при более жёстком требовании не выше ни в одной паре сценариев. Калибровка ради гейта не менялась.
  expected_mass: 0.068
  valid_until: 2026-11-30
capital_gap:
  explanation: >-
    Гейт отмечает клетки, где норматив достаточности собственных средств (капитала) банка Н1.0 опускается ниже пола
    требований с надбавками.
    Это девять клеток режима «Кризис» во всех мирах и сценариях и одна клетка «Розничного спада» мира «Рыночный как есть» в
    сценарии «Жёсткий» (вместе 15,85 % вероятности; в полосе — во всех прогонах, потому что режим «Кризис» есть в каждом из
    них). Разовый убыток 28 млрд ₽ в первом квартале 2027 года и стоимость риска года шока 4,6–4,7 % снижают норматив до
    11,1–11,9 % к концу 2027 года — выше пола того года 10,75 %. Но 1 января 2028 года надбавки поднимают пол ступенью до
    12,0 % («По графику») и 12,5 % (в двух других сценариях), и норматив оказывается ниже пола на 0,1–1,6 п.п.; наименьшие
    значения — 10,9–11,4 %. Пробит пол с надбавками, а не минимум 8 %: книга в ответ останавливает рост кредита и не платит
    дивиденд за год шока, новый капитал не привлекает. Норматив возвращается выше пола со второго по третий квартал 2028 года
    в мире «Нормализация ставок», с третьего квартала 2028 года по второй квартал 2029 года в мире «Высокие ставки надолго» и с
    третьего квартала 2029 года по третий квартал 2030 года в мире «Рыночный как есть» (раньше всего — в сценарии «По
    графику»). Клетка «Розничного спада» ниже пола один квартал — первый квартал 2028 года, на 0,06 п.п. (12,44 % при поле
    12,5 %): ступень надбавок приходит, пока прибыль мира высоких ставок медленно восстанавливает запас.
  expected_mass: 0.159
  valid_until: 2026-11-30
m_crisis_vs_cbr:
  explanation: >-
    Гейт сверяет клетки «Рыночный как есть» × «Кризис» с рисковым сценарием Банка России: рост кредита 2027 года
    0–5 %, 2028 года 2–7 %, стоимость риска года шока не ниже 4,5 %, наименьший норматив достаточности собственных
    средств (капитала) банка Н1.0 не выше 12,84 % (пол 12,0 % и запас менеджмента 0,84 п.п.). Расходится одно условие — рост кредита 2028 года: 0,0 % во всех трёх клетках (3 %
    вероятности). Причина — капитал: после разового убытка 2027 года и ступени надбавок 1 января 2028 года норматив ниже
    пола, и книга не даёт кредиту расти, пока запас не восстановится; в этом мире рост стоит до 2029 года включительно, в
    сценариях «АЦН 1 % и консолидация страховщиков» и «Жёсткий» — и в 2030 году («По графику» — 4,5 %). Кризис книги в мире
    высоких ставок жёстче сценария Банка России по кредиту — в консервативную сторону. Стоимость риска года шока (4,6–4,7 %) и
    наименьший норматив (10,9–11,1 %) — в коридоре сценария.
  expected_mass: 0.03
  valid_until: 2026-11-30
growth_cut:
  explanation: >-
    Гейт отмечает клетки, где ограничение капиталом урезает рост кредитных книг больше чем на 35 % роста, который дал бы спрос.
    Таких клеток четыре, все в мире «Рыночный как есть» (3,7 % вероятности): «Розничный спад» в сценариях «АЦН 1 % и
    консолидация страховщиков» (36,6 % к концу 2034 года) и «Жёсткий» (40,3 % к концу 2032 года), «Кризис» в тех же сценариях
    (35,9 % и 38,7 % к концу 2036 года). В мире высоких ставок предельный кредит окупает капитал хуже его стоимости (единица
    корпоративного бизнеса в 2036 году — 9,2 % после налога при стоимости капитала 21,8 %), а требование с запасом менеджмента
    там 13,6–13,8 % с 2029 года («Жёсткий»; запас — 0,84 п.п., среднее скользящих окон): прибыль восстанавливает запас медленно,
    и рост годами ждёт капитала. Урезанный рост в этих клетках — порядок книги (сначала уступает рост, затем дивиденд), а не
    ошибка спроса; в остальных клетках урезано не больше 35 % роста.
  expected_mass: 0.037
  valid_until: 2026-11-30
step_dividend:
  explanation: >-
    Гейт срабатывает, когда у ступени пола норматива дивиденд по политике приходится срезать. Это все 27 клеток
    режимов без шока (85 % вероятности): срезаны решения о дивиденде за прибыль 2026 и 2027 годов. Норматив
    достаточности собственных средств (капитала) банка Н1.0 на якоре — 10,985 % до вычета дивиденда за 2025 год (10,805 %
    после вычета) при требовании с запасом менеджмента 10,84 %; надбавки растут
    ступенями 1 января 2027 года (пол 10,75 %) и 1 января 2028 года (12,0–12,5 %), и к 2028 году банку нужно на
    2,0–2,5 п.п. капитала больше, чем в 2026 году. Книга удерживает прибыль и платит меньше политики: в клетке «Высокие
    ставки надолго» × «Мягкая посадка» × «АЦН 1 % и консолидация страховщиков» — по 0,35 ₽ на акцию за 2026 и 2027 годы,
    как банк за 2024 и 2025 годы, вместо 0,90 и 1,12 ₽ по политике; с 2028 года выплата выше политики (1,48 ₽ против 1,35 ₽) —
    книга отдаёт накопленный запас. Это порядок книги для банка, чей капитал стоит у требования: рост и дивиденд уступают
    ступени надбавок. Справочно: в пятнадцати клетках доля прироста кредита в квартал ступени падает больше чем на
    25 п.п.
  expected_mass: 0.85
  valid_until: 2026-11-30
nim_path_joint:
  explanation: >-
    Гейт следит, чтобы в первых восьми кварталах после якоря не было ступени маржи: управленческая чистая процентная
    маржа квартала не должна быть выше большей из двух величин — маржи якоря по счёту модели (7,55 %; отчётная маржа
