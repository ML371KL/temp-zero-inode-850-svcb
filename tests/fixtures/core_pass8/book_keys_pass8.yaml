# Пример книги прохода ядра 8 (core8-spec, 28.10.2026) — фрагмент шаблона assumptions_template.yaml на p3 @ d127189.
# Числа κ и ρ — сухой перевывод прототипа (scratchpad c8, rederive --dry-run, метка c8-line); в книгу их пишет КОМАНДА
# (ops/tools/rederive.py, шаг share_roots), руками не переносить. Без ключей ниже ядро считает бит в бит как на d127189.

volumes:
  # Р10-5 (класс 1): одна форма суждения «связь строки страхования λ». line — франшиза страхования в смеси базы расходов и
  # книга страховых К6 растут ФОРМОЙ СТРОКИ: смесь темпов г/г g = (1 + w + λ (x − 1 − w)) (1 + корень) (форма корня — ключ
  # volumes.line_root_form, у книги multiplicative). Франшиза: Φ_q = Φ_(q−4) g(A_q / A_(q−4), w, λ, κ_q), Φ_x = A_x / A_0;
  # К6: Ψ_q = Ψ_(q−4) g(D_q / D_(q−4), w, λ, ρ_q), Ψ_x = D_x / D_0, E_q = E_0 Ψ_q (D — база строки на концах кварталов).
  # Нет ключа или mixed — прежние формы (франшиза — смесь уровней λ A/A_0 + (1 − λ) H, К6 — цепь на концах).
  line_link_form: line
  # ρ формы строки — корень г/г (не квартальный, как в форме цепи!): выведено правилом листа — в слое M до 2029К4
  # E_M[Ψ_q] = E_M[D_q] / D_0; с 2030 года 0. Совместная неподвижная точка с κ (шаг share_roots), 4–5 кругов.
  liability_driver_roots:
    insurance: {"2026Q3": -0.07692, "2026Q4": -0.088344, "2027Q1": -0.062635, "2027Q2": -0.053232, "2027Q3": -0.039922,
                "2027Q4": -0.029582, "2028Q1": -0.039672, "2028Q2": -0.03847, "2028Q3": -0.04132, "2028Q4": -0.035702,
                "2029Q1": -0.028819, "2029Q2": -0.019353, "2029Q3": -0.017683, "2029Q4": -0.01382, LT: 0.0, LT_from: 2030}

opex:
  # κ формы строки — корень всей смеси темпов г/г франшизы (≈ 0,655 κ формы уровней): в слое M до 2029К4
  # E_M[Φ_q] = E_M[A_q] / A_0; с 2030 года 0.
  line_share_roots:
    insurance: {"2026Q3": -0.06871, "2026Q4": -0.082628, "2027Q1": -0.072203, "2027Q2": -0.057932, "2027Q3": -0.045166,
                "2027Q4": -0.034772, "2028Q1": -0.038083, "2028Q2": -0.039069, "2028Q3": -0.044132, "2028Q4": -0.038503,
                "2029Q1": -0.035312, "2029Q2": -0.024041, "2029Q3": -0.020458, "2029Q4": -0.015738, LT: 0.0, LT_from: 2030}

checks:
  # Р10-6 (класс 2): число гейта — ожидание мира: отношение ожиданий процентов к остаткам по клеткам мира с весами
  # P(r, s | w) = P(r) P(s | r); модальная клетка печатается рядом. Нет поля или modal_cell — клетка «мир × модальный режим ×
  # модальный сценарий» (бит в бит). Порог и from_year — прежние (порог пишет лист nii).
  funds_cost_to_key: {max: 0.870, from_year: 2030, scope: world_expectation}
  # Р10-1 в числах гейтов ядра (ключ (3) спецификации; СТАВИТ ВЕДУЩИЙ — см. красный флаг): книги «средств клиентов» в числах
  # гейтов funds_cost_to_key и wholesale_share и в печати пути фондирования — без книг К6. all (≡ нет ключа) — roles.funds.
  # ВНИМАНИЕ: с clients и порогом «одних клиентов» 0,876 (комментарий шаблона, поток sheetsfix) гейт СРАБАТЫВАЕТ в центре
  # (мир M 0,883), шаг ends_phi_axis листа по своему правилу останавливается — решение ведущего до записи.
  # client_funds: clients

# valuation.uncertainty.axes (НЕ ПРАВИТЬ РУКАМИ — только пометка): 8 связок, несущих пути κ и ρ (М13 41, база страхования 49,
# база комиссий 50, периметр 52–55, связь страхования 59), — на каждом конце κ и ρ выводятся ТЕМ ЖЕ правилом формы строки
# (end_share_roots); замер прототипа — правило против записи ≤ 1,7e-5 (допуск 5e-5), невязка уровня ≤ 3,5e-5 (допуск 1e-4,
# Р10-13). Концы связи страхования (ось 59): low (λ 0) — у франшизы формы совпадают (Φ = H), κ конца ≈ κ формы уровней;
# high (λ 0,74) — κ и ρ формы строки при λ 0,74. Числа концов — запись команды.
