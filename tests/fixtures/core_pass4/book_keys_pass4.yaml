# Фрагмент книги Совкомбанка с ключами прохода ядра 4 В ЦЕНТРЕ (ключ core4-spec, 22.10.2026; решения ведущего № 5: Р5-4, Р5-5, Р5-6).
# Числа — сухой перевывод p5-all (копия p3 @ c709f22 + прототип proto_apply.py; ops/tools/rederive.py --dry-run): корни строк и
# концы осей баз выведены листом при всех трёх ключах. Ось интенсивности окон CoR (Р4-13) — концы из вариантов cor_intensity_ifrs /
# _databook книги (листу вывода — свой шаг, см. spec.yaml: sheet). ПРЕДВАРИТЕЛЬНО: перевывод книги делает интеграция круга 5.
volumes:
  line_root_form: multiplicative       # Р5-6: рост строки = (1 + рост базы)(1 + корень) − 1 у комиссий и страхования (расходы — уже так)
capital:
  rwa:
    guarantees:
      driver: fees_component           # Р5-5: драйвер G_q — уровень базы КОМПОНЕНТЫ смеси комиссий, а не вся смесь
      component: corporate             # имя компоненты fees.volume_base.mix (её база {corp_loans: 1} — книга выреза: К5 ≡ выключен, бит в бит)
fees:
  growth_vs_wages: {2026: -0.0739, 2027: 0.0364, 2028: 0.0364, 2029: 0.0364, LT: 0.0, LT_from: 2030}   # перевывод при множителе (было 2026 −0.0813, 2027–2029 0.0392)
other:
  insurance_growth_vs_wages: {2026: -0.1334, 2027Q1: 0.2016, 2027Q2: 0.0864, 2027Q3: 0.0345, 2027Q4: 0.0345, 2028: 0.0345, 2029: 0.0345, LT: 0.0, LT_from: 2030}   # перевывод при множителе (было 2026 −0.1346, 2028–2029 0.0361)
opex:
  real_growth: {2026: 0.0257, 2027Q1: 0.0457, 2027Q2: 0.0205, 2027Q3: 0.0039, 2027Q4: 0.0039, 2028: 0.0039, 2029: 0.0039, LT: 0.0, LT_from: 2030}   # перевывод (2026: 0.0255 → 0.0257)
checks:
  cir_lt: {target: 0.4779, tolerance: 0.01, from_year: 2033, scope: market_layer}
valuation:
  uncertainty:
    bundle_compose: additive           # Р5-4: связки складываются на общем пути; приращение связки — от центра корневой книги
    axes:                              # (… прочие оси книги без изменений; ниже — три изменённые/новые, в конце списка)
      - {name: "База страхования: розница … все кредиты (доли смеси на якоре; К2б, Р4-1)", kind: bundle, paths: [other.insurance_volume_base.mix.retail.share, other.insurance_volume_base.mix.loans.share, other.insurance_growth_vs_wages.2026, other.insurance_growth_vs_wages.2027Q1, other.insurance_growth_vs_wages.2027Q2, other.insurance_growth_vs_wages.2027Q3, other.insurance_growth_vs_wages.2027Q4, other.insurance_growth_vs_wages.2028, other.insurance_growth_vs_wages.2029, opex.real_growth.2026, opex.real_growth.2027Q1, opex.real_growth.2027Q2, opex.real_growth.2027Q3, opex.real_growth.2027Q4, opex.real_growth.2028, opex.real_growth.2029], low: {other.insurance_volume_base.mix.retail.share: 1.0, other.insurance_volume_base.mix.loans.share: 0.0, other.insurance_growth_vs_wages.2026: -0.0954, other.insurance_growth_vs_wages.2027Q1: 0.1925, other.insurance_growth_vs_wages.2027Q2: 0.0773, other.insurance_growth_vs_wages.2027Q3: 0.0254, other.insurance_growth_vs_wages.2027Q4: 0.0254, other.insurance_growth_vs_wages.2028: 0.0254, other.insurance_growth_vs_wages.2029: 0.0254, opex.real_growth.2026: 0.0323, opex.real_growth.2027Q1: 0.0437, opex.real_growth.2027Q2: 0.0185, opex.real_growth.2027Q3: 0.0019, opex.real_growth.2027Q4: 0.0019, opex.real_growth.2028: 0.0019, opex.real_growth.2029: 0.0019}, high: {other.insurance_volume_base.mix.retail.share: 0.0, other.insurance_volume_base.mix.loans.share: 1.0, other.insurance_growth_vs_wages.2026: -0.1712, other.insurance_growth_vs_wages.2027Q1: 0.2113, other.insurance_growth_vs_wages.2027Q2: 0.0961, other.insurance_growth_vs_wages.2027Q3: 0.0442, other.insurance_growth_vs_wages.2027Q4: 0.0442, other.insurance_growth_vs_wages.2028: 0.0442, other.insurance_growth_vs_wages.2029: 0.0442, opex.real_growth.2026: 0.019, opex.real_growth.2027Q1: 0.0478, opex.real_growth.2027Q2: 0.0226, opex.real_growth.2027Q3: 0.006, opex.real_growth.2027Q4: 0.006, opex.real_growth.2028: 0.006, opex.real_growth.2029: 0.006}, dist: triangular, unit: number}
        # Р5-4: ось базы страхования несёт и корни расходов (франшиза страхования в базе расходов идёт за базой строки, класс 1);
        #   путь корней расходов водят также связка М13, ось базы комиссий и ось вида shift уровня расходов — приращения складываются
