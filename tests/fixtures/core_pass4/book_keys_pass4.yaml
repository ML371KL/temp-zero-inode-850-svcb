        # Р5-4: то же для франшизы комиссий (доля opex.line_shares.fees)
      - {name: "Стоимость риска: интенсивность состава окон (МСФО … датабук; Р4-13)", kind: bundle, paths: [regimes.norm.cor.LT, regimes.soft.cor.2026, regimes.soft.cor.2027, regimes.soft.cor.2028, regimes.soft.cor.2029, regimes.soft.cor.LT, regimes.norm.cor.2026, regimes.norm.cor.2027, regimes.norm.cor.2028, regimes.norm.cor.2029, regimes.downturn.cor.2026, regimes.downturn.cor.2027Q1, regimes.downturn.cor.2027Q2, regimes.downturn.cor.2027Q3, regimes.downturn.cor.2027Q4, regimes.downturn.cor.2028, regimes.downturn.cor.2029, regimes.downturn.cor.LT, regimes.crisis.cor.2026, regimes.crisis.cor.2028, regimes.crisis.cor.2029, regimes.crisis.cor.LT], low: {regimes.norm.cor.LT: 0.023793, regimes.soft.cor.2026: 0.021102, regimes.soft.cor.2027: 0.018095, regimes.soft.cor.2028: 0.016102, regimes.soft.cor.2029: 0.016132, regimes.soft.cor.LT: 0.023181, regimes.norm.cor.2026: 0.025246, regimes.norm.cor.2027: 0.023754, regimes.norm.cor.2028: 0.023619, regimes.norm.cor.2029: 0.023648, regimes.downturn.cor.2026: 0.029112, regimes.downturn.cor.2027Q1: 0.030928, regimes.downturn.cor.2027Q2: 0.032685, regimes.downturn.cor.2027Q3: 0.034443, regimes.downturn.cor.2027Q4: 0.036202, regimes.downturn.cor.2028: 0.031235, regimes.downturn.cor.2029: 0.029067, regimes.downturn.cor.LT: 0.029207, regimes.crisis.cor.2026: 0.029112, regimes.crisis.cor.2028: 0.038046, regimes.crisis.cor.2029: 0.022625, regimes.crisis.cor.LT: 0.026481}, high: {regimes.norm.cor.LT: 0.022856, regimes.soft.cor.2026: 0.021134, regimes.soft.cor.2027: 0.017762, regimes.soft.cor.2028: 0.015805, regimes.soft.cor.2029: 0.015835, regimes.soft.cor.LT: 0.022553, regimes.norm.cor.2026: 0.024567, regimes.norm.cor.2027: 0.022818, regimes.norm.cor.2028: 0.022688, regimes.norm.cor.2029: 0.022716, regimes.downturn.cor.2026: 0.028479, regimes.downturn.cor.2027Q1: 0.029838, regimes.downturn.cor.2027Q2: 0.031533, regimes.downturn.cor.2027Q3: 0.033229, regimes.downturn.cor.2027Q4: 0.034925, regimes.downturn.cor.2028: 0.030134, regimes.downturn.cor.2029: 0.028042, regimes.downturn.cor.LT: 0.028177, regimes.crisis.cor.2026: 0.028479, regimes.crisis.cor.2028: 0.038391, regimes.crisis.cor.2029: 0.021671, regimes.crisis.cor.LT: 0.025901}, dist: triangular, unit: pct}
        # Р4-13 через Р5-4: ось интенсивности окон CoR — связка на ключах режимов (центр — середина источников, концы — МСФО и датабук
        #   на составе якоря); ключи режимов водят также связка κ и оси вида shift (уровень LT, кризис и спад 2027) — приращения складываются.
        #   Первый путь — regimes.norm.cor.LT (адрес оси и печать; ни у одной другой оси он не первый)
  reference_variants:                  # Р5-5: вариант guarantees_off после ключа стоит 0 бит в бит — заменить вариантом прежней формы:
    - {id: guarantees_mix_driver, title: "RWA гарантий за всей смесью базы комиссий (форма круга 4)", overrides: {capital.rwa.guarantees.driver: fees_base}}
    # Р4-13: варианты cor_intensity_databook / cor_intensity_ifrs — концы оси (цена ошибки суждения печатается осью); из таблицы развилок снять
