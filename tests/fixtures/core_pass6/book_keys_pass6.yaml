       overrides: {opex.line_share_roots: {}}}            # цена Р8-6 целиком: −0,101 / −0,068 ₽
    # при Р8-6б:
    - {id: insurance_liab_no_root, title: "Книга страховых К6 без корня номинальной части (Р8-6б выключен; прежняя форма)",
       overrides: {volumes.liability_driver_roots: {}}}   # +0,263 / +0,293 ₽
  # вариант insurance_liab_as_funds (К6 выключен) — ключ Р8-6б не читается (книга не ведомая): подмена не нужна

