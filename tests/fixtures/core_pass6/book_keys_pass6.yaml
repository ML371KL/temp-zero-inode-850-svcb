# Фрагмент книги прохода ядра 6 (Р8-6; ключ core6-spec, 22.10.2026) — для потока книги ПОСЛЕ слияния ядра с ключом.
# Числа κ и ρ — ВЫВЕДЕННЫЕ (не суждения): правило листа вывода ниже; в шаблон их пишет команда (rederive), руками не правятся.
# Значения — неподвижная точка прототипа на книге p3 @ 48f3ca2 (сетка ядра копии, слой M = macro_neutral, 4 круга, запись 6 знаков).
# Все цены ПРЕДВАРИТЕЛЬНЫЕ (сетка и малая полоса 600 прогонов прототипа; своя выборка 60 осей и общие числа круга 4).

opex:
  # Р8-6 (решения ведущего № 8; класс 1): франшиза строки страхования в смеси базы расходов идёт за СВЯЗЬЮ СТРОКИ λ
  #   (other.insurance_volume_link): доля λ — за базой строки A^I (как было), доля 1 − λ — за номиналом мира с корнем κ:
  #   Φ_q = λ A^I_q / Ā^I_0 + (1 − λ) H_q;  H_q = H_(q−4) (1 + wage_W,q)(1 + κ_q);  H_x = A^I_x / Ā^I_0 при x ≤ 0.
  # κ — корень номинальной части (общий для миров, как корни строк): переход до 2029К4, с 2030 года 0. ВЫВОДИТ КОМАНДА по правилу
  #   «в слое M номинальная часть идёт за базой строки до 2029К4»: κ_q = E_M[A^I_q] / E_M[A^I_(q−4)] / (1 + w^M_q) − 1 — рост базы
  #   строки слоя M к росту зарплат мира M (история — факты). Тогда в условиях окна (слой M) франшиза и выручка строки стоят на
  #   той же базе, на которой мерены их окна (суждение о связи λ уровня в условиях окна не двигает — как у самой строки, чьи корни
  #   держат её к той же базе), а между мирами и после 2029 года франшиза дрейфует ровно как строка: (1 − λ)(зарплаты − база).
  #   Без ключа (и при пустом словаре) — франшиза целиком за базой строки (прежняя строка, бит в бит). При λ = 1 ключ ничего не
  #   меняет (бит в бит). Цена: точка +0,101, медиана своя +0,068, общие числа +0,018 ₽ (без перевывода; сухой перевывод
  #   центра — «изменений нет»: корни расходов и строки те же).
  line_share_roots:
    insurance: {"2026Q3": -0.104153, "2026Q4": -0.124338, "2027Q1": -0.108462, "2027Q2": -0.086598, "2027Q3": -0.067104, "2027Q4": -0.051063, "2028Q1": -0.056452, "2028Q2": -0.057669, "2028Q3": -0.064262, "2028Q4": -0.054791, "2029Q1": -0.049003, "2029Q2": -0.031664, "2029Q3": -0.025871, "2029Q4": -0.017508, LT: 0.0, LT_from: 2030}

# ---- Р8-6б (обзор класса; РЕШЕНИЕ ВЕДУЩЕГО, вопрос 1): книга страховых К6 — тот же экземпляр класса 1. Ключ — только если
#      ведущий включит его в проход; без ключа К6 — прежняя строка (бит в бит).
volumes:
  # К6 + Р8-6б: номинальная часть роста книги-обязательства за драйвером строки несёт корень ρ (общий для миров):
  #   E_b,q = E_b,q−1 (1 + wage_q)^((1 − λ)/4) (D_q / D_q−1)^λ (1 + ρ_q)^(1 − λ);
  #   ρ_q = E_M[D_q] / E_M[D_(q−1)] / (1 + w^M_q)^(1/4) − 1 до 2029К4 (D — уровень базы строки на конце квартала), с 2030 — 0.
  #   ВЫВОДИТ КОМАНДА. Цена: точка −0,263 (−0,260 до второго круга ρ), медиана своя −0,293, общие числа −0,185 ₽ (поверх Р8-6);
  #   сухой перевывод центра — сдвиг ближнего пути ЧПМ +3 % (near_nim_shift 0,000935 → 0,000964), точка 17,01 ₽.
  liability_driver_roots:
    insurance_liab: {"2026Q3": -0.03461, "2026Q4": -0.034312, "2027Q1": -0.01045, "2027Q2": -0.007828, "2027Q3": -0.013922, "2027Q4": -0.014196, "2028Q1": -0.017832, "2028Q2": -0.006277, "2028Q3": -0.010319, "2028Q4": -0.010522, "2029Q1": -0.002096, "2029Q2": 0.001989, "2029Q3": -0.004051, "2029Q4": -0.008068, LT: 0.0, LT_from: 2030}

