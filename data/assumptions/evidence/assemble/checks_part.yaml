# ------------------------------------------------------------------ КОРИДОРЫ ГЕЙТОВ И ДОПУСКИ ИНВАРИАНТОВ (MODEL §14) — гейты формы Т; коридоры,
#                                                                    которые у Т подбирались пробными проходами, — по счёту ядра после первой сетки
checks:
  ddm_ri_tol: 0.001                                            # инвариант ddm_equals_ri: |V_DDM − V_RI| / V_RI в клетке
  transmission_tol: 1.0e-9                                     # инвариант transmission_solved
  exdate_jump_tol: 0.01                                        # инвариант exdate_jump: скачок на экс-дату = −DPS × акции в обращении / делитель ± 1 %
  pb_by_world: {N: [0.2, 2.5], H: [0.2, 2.5], M: [0.2, 2.5]}   # V/BV клетки по мирам [В: рынок — P/B 0,54 на 30.06.2026; книги семейства 0,40 (ВТБ) … 1,05 (Т)]
  roe_range: [-0.10, 0.35]                                     # ROE года: прибыль акционеров к капиталу МСФО [В: 1П2026 ≈ 20 %; 2022 — убыток]
  cor_range: [0.005, 0.07]                                     # CoR года, базис движка [В: лист pnl ≈ 0,01–0,07; кризис 2027 — 4,9 % упр. с пиком 6,2 % квартала]
  nim_range: [0.04, 0.10]                                      # ЧПМ квартала, упр. базис: кварталы 2023–2026 годов 4,3–7,6 % опр. банка [В]
  cir_range: [0.35, 0.70]                                      # C/I года, базис движка: окно R 43,1–59,6 % [В: лист pnl]
  roe_k_spread: {range: [-0.15, 0.10], max_world_gap: 0.08}    # ROE'_T − k_T клетки и разрыв средних по мирам [В]
  terminal_share: [0.15, 0.65]                                 # доля PV терминала в V (DDM) [В: как в моделях семейства]
  real_rate: [0.02, 0.13]                                      # реальная ставка мира в терминале [В: как в моделях семейства]
  bridge_drift_pp: {cor: 0.007, nim: 0.08}                     # дрейф моста упр. ↔ движок ≈ 2,5σ: CoR (аддитивный) σ 0,0029; ЧПМ (ratio) σ 0,032 [Р: поток facts / sheetsfix]
  nim_path_joint: {quarters: 8, tolerance: 0.003}              # ЧПМ упр. первых 8 прогнозных кварталов ≤ max(ЧПМ якоря, Nss мира) + 0,3 п.п. [В: как у Т]
  transmission_pairs: [-0.20, 0.30]                            # парные передачи соседних миров (N→H, H→M), базис движка [В: как у Т; центр листа nii −0,005 / −0,108]
  #{{FRAG calib-nii/nii_block.yaml|checks.lt_spread_floor}}
  ni_jump: {quarters: 8, yoy: 0.40, key_tol: 0.01}             # флаг — прибыль квартала г/г > +40 % при ключевой ±1 п.п. к тому же кварталу [В: как у Т]
  m_crisis_vs_cbr:                                             # «M × кризис» против рискового сценария Банка России
    loan_growth: {"2027": [0.0, 0.05], "2028": [0.02, 0.07]}   # [НП: ОНДКП, табл. 3.5 — через книгу Сбера; лист pnl]
    cor_shock_year: 0.045                                      # CoR года шока (упр. базис) не ниже [В: лист pnl; путь кризиса 4,9 % в 2027 году]
    n20_min: 0.129                                             # минимум Н1.0 клетки не выше: пол «по графику» с 2028 года 12,0 % + запас 0,9 п.п. [В: лист capital]
  manual_overdue_days: {ifrs_fact: 7, worlds_after_cbr: 21, dividend_register: 5, capital_form: 7}   # [В: как у Т]
  book_update: {shift_bp: 50, max_age_days: 45}                # совещательный флаг [В: как в моделях семейства]
  guidance_items:                                              # узлы гайденса (facts/guidance.json): у эмитента чисел 2026 года в доступных документах нет — значения null с
                                                               #   причиной; гейт начнёт сравнивать, когда они появятся (решение владельца О6)
    - {key: roe, path: items.roe, title: "ROE за год", words: "ROE", basis: mgmt, gate: true}
    - {key: nim, path: items.nim, title: "ЧПМ", words: "ЧПМ (опр. банка)", basis: mgmt, gate: true}
    - {key: cor_max, path: items.cor_max, title: "Стоимость риска (не выше)", words: "стоимость риска (опр. банка)", basis: mgmt, gate: true}
    - {key: cir, path: items.cir, title: "C/I", words: "C/I (опр. банка)", basis: mgmt, gate: true}
  growth_cut: {max_cut_share: 0.35}                            # гейт — рост портфеля урезан капиталом сильнее коридора [В: как у Т]
  step_dividend: {max_lam_drop: 0.25}                          # гейт среза дивиденда у ступени минимума [В: как у Т]
  cir_lt: {target: 0.50, tolerance: 0.03, from_year: 2033, scope: market_layer}
                                                               # цель C/I сквозь цикл, упр. базис (опр. банка), среднее 2033–2036 в ожидании слоя «рыночные ставки как есть» —
                                                               #   ПРОВЕРКА РЕЗУЛЬТАТА, а не правило подбора (корни расходов выводятся под уровень расходов к активам 3,78 %):
                                                               #   арифметика уровней окна R при ЧПМ мира M решения № 1 (6,63 % × 0,795 активов = 5,27 %): 3,78 / (5,27 + 1,18 +
                                                               #   1,54 − 0,43) = 50,0 % [Р: формула листа pnl, sheets/validate.json, с маржой решения № 1]; допуск 3 п.п. (лист pnl)
  mix_ratio_tolerance: 0.0015                                  # допуск сверки норматива смеси с ожиданием нормативов клеток [В: как у Т]
  wholesale_share: [0.08, 0.40]                                # доля оптового фондирования на конец года [В: стартовый; правило коридора — доля якоря минус 5 п.п. … наибольшая
                                                               #   доля по клеткам плюс 5 п.п. (лист evidence/path) — переносится после первой сетки]
  window_backtest: {from_year: 2030, cor: [0.0174, 0.0369], cir: [0.424, 0.678], nim: [0.0713, 0.0721], means: {nim: 0.0717, cor: 0.0283, cir: 0.540}, loans_share: 0.696}
                                                               # уровни слоя «рыночные ставки как есть» против окна фактов — средние за 2030–2036 годы, упр. базис (опр. банка):
                                                               #   CoR и C/I — между наименьшим и наибольшим кварталом окна R 2024К2–2026К2 [Ф/Р: устав §2, лист pnl:
                                                               #   CoR 1,74–3,69 % (среднее 2,83), C/I банка 42,4–67,8 % (54,0)]. Маржа гейтом не сверяется (ключ включает узел
                                                               #   уровней): поля nim — кварталы окна L на составе якоря 7,13 / 7,21 % (решения № 1, п. 1), means.nim — 7,17 %;
                                                               #   loans_share — доля кредитов в процентных активах движка окна L 69,6 % (лист nii, l_window_translation)
  funds_cost_to_key: {max: 0.870, from_year: 2030}             # стоимость средств клиентов (с книгой страховых — роль средств юрлиц) к ключевой в клетке «мир × модальный режим ×
                                                               #   модальный сценарий», средняя за 2030–2036 — не выше наибольшего квартала окна R [Р: поток sheetsfix — 0,870
                                                               #   на той же величине; у одних клиентов 0,876]: сторож раскладки сжатия маржи
  point_path: true                                             # таблицы книги несут годовой путь смеси точки
  volume_sign: {tol: 0.01}                                     # гейт знака объёмных эффектов, ₽ на акцию: десятая шага печати [В]
  stress_sign: {loss_step: 30.0, tol: 0.3}                     # гейт знака стресса, млрд ₽: шаг убытка ≈ разовый убыток кризиса (28), допуск — пропорционально капиталу Т [В]
