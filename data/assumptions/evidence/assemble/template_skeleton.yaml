# Книга допущений ПАО «Совкомбанк» (850-svcb) — ШАБЛОН машинной книги, версия 0.1 «первые числа на неизменённом ядре»
# (фаза 3, 21.10.2026; дата книги meta.date — 20.10.2026: день оценки; цена — последнего дня торгов с ценой на диске).
# Собран сборщиком evidence/assemble/assemble_template.py из фрагментов листов этапа 1 (svcb-850-handoff/stage1:
# calib-nii, calib-pnl, calib-capital — после правок листов потока sheetsfix) и частей сборщика (meta, миры, valuation,
# checks). Дальше шаблон правят руками и командой перевывода (ops/tools/rederive.py), сборщик повторно не запускают.
# Из шаблона data/assumptions/build_assumptions.py собирает машинную книгу assumptions.yaml (+ .json): вписывает миры семейства
# (worlds.N|H|M — на место строки-метки WORLDS в блоке worlds), банковскую надстройку (worlds_bank — строка-метка WORLDS_BANK)
# и её sha256 (метка OVERLAY_SHA256). Правят шаблон; машинную книгу — только сборкой.
# Правила центров — устав калибровки (svcb-850-handoff/notes/CALIBRATION-CHARTER.md) с правками решений ведущего № 1
# (notes/LEAD-DECISIONS-1.md: при расхождении действуют решения). Ядро (model/) — дерево Т без изменений: числа этой книги —
# проверка уровней и принципа калибровки, а не ответ (PLAYBOOK семейства, фаза 3).
# Метки в комментариях:
#   [Ф]  — факт с источником; [Р] — расчёт по фактам; [В] — суждение (устав, лист этапа 1 или сборщик); [О] — оценка;
#   [НП] — не проверено по первичке.
#   null — только там, где ядро ключ не читает (выключатель, неактивный режим календаря); "anchor" — значение из фактов якоря.
#   ВЫВЕДЕНО НА ЯДРЕ — число следует из суждения книги и решения передачи либо из пути баланса клеток: его выводит одна команда
#          (evidence/path/derive_on_engine.py через ops/tools/rederive.py). У ключа до вывода — «ВЫВОДИТСЯ НА ЯДРЕ».
# Единицы: деньги — млрд ₽; акции — млн шт.; ставки, темпы, доли — доли единицы, годовые; п.п. — тоже доли (0,001 = 0,1 п.п.).
# ЧПМ «опр. банка» — ЧПД формы / средние процентные активы банка (без денег); ЧПМ движка — ЧПД движка (с финансовыми
# расходами страхования МСФО 17, книга insurance_liab) / средние процентные активы движка. Ядро держит мост одним числом
# (ratio фактов b = 0,834987); точная связь стационаров: ЧПМ_движка(W) = ЧПМ_банка(W) × R − ife_W × l_ins (поток sheetsfix).
# Траектории: {ключ: значение}; ключи "2026Q3" (квартал), "2026H2" (полугодие), "2027" (год), LT и LT_from (год выхода на LT).
# Ключ "2026" действует на 3-й и 4-й кварталы 2026 года (якорь — 2-й квартал). Правило чтения — docs/MODEL.md §0.4.
# Незнакомый ключ — отказ BookError (закрытая схема).

meta:
  version: "0.1"
  schema: svcb-v1                    # имя схемы выпуска (docs/PAYLOAD.md)
  date: "2026-10-20"                 # дата книги: день оценки
  facts_date: "2026-06-30"           # отчётная дата якоря (МСФО группы за 6 месяцев 2026 года)
  anchor_period: "2026Q2"            # последний отчётный квартал
  first_period: "2026Q3"             # первый прогнозный квартал
  last_period: "2036Q4"              # последний квартал явного участка; терминал — с 2037 года
  valuation_date: "2026-10-20"       # дата оценки книги
  curve_as_of: "2026-09-18"          # дата кривых миров (запись семейства magnit-850oa book-1.6); перекат — MODEL §0.5
  market_price: {SVCB: 10.105}       # ₽, LEGALCLOSEPRICE ISS 19.10.2026 [Ф: research/samples/svcb-capital-shares/iss_SVCB_TQBR_history.csv]
