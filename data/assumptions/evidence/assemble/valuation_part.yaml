# ------------------------------------------------------------------ ОЦЕНКА (A-V*) — сборщик; β, премия, делитель — лист capital (valuation_block.yaml)
valuation:
  shares_basis: outstanding                                    # A-V6: делитель — акции в обращении по МСФО (22 431,1 млн на 30.06.2026: выпущено 22 516,2 − у группы 85,1,
                                                               #   из них у банка 70,18, у страховой дочки 14,94) [Ф: МСФО 6М2026 прим. 22 с. 41]; устав §3: «акции в обращении
                                                               #   минус путь выкупа» — путь выкупа в share_count_adj
  share_count_adj: -0.12798                                    # путь выкупа дочкой до 2028К4 по 10,105 ₽: −2 870,8 млн акций / 22 431,1 [Р: stage1/calib-capital/sheets/buyback_path.csv]
                                                               #   делитель 19 560,3 млн; связка трёх ключей (equity.other_movements, share_count_adj, dividends.policy.payout) —
                                                               #   одно суждение (класс 1); цена выкупа одна на все миры (класс 2, решения № 1, п. 12 — принять для первых чисел; М3)
  beta_e: 0.91                                                 # A-V1 [Р: Недельная доходность к индексу полной доходности, вся история с IPO]
                                                               #   правило семейства — окно 3 года; у SVCB торги с 15.12.2023 ⇒ вся история: 0,916 (без 4 недель после IPO —
                                                               #   0,910; ст. ош. 0,09); 1 год 0,69, 2 года 0,88 [Р: research/facts/svcb_beta.csv; перепроверка — calib-capital/code/cc_beta.py]
  erp: 0.0557                                                  # A-V2: конвенция семейства [Ф: Премия за риск по Дамодарану на январь 2026 года; решение владельца 30.09.2026]
  roll_along_forwards: true                                    # A-V10: перекат по форвардам (MODEL §0.5)
  governance:                                                  # A-V7: дисконт за управление — 0, каналы не заводились (фаза 3; лист evidence/governance Совкомбанка не делался)
    discount: 0.0
    components: []
  terminal:                                                    # как в книге Т
    real_growth: 0.015                                         # A-V3b: g_real [В: Суждение книги; потенциальный рост экономики по Банку России — 1,5–2,5 %]
    fade: 0.5                                                  # A-V4: угасание избыточной доходности [В: Суждение книги: избыточная доходность сходит за 15 лет после 2036 года]
    excess_capital_multiple: 1.0                               # избыток капитала на T — 1:1 [В]
    timing: year_end
  headline:
    print_step: 0.1                                            # A-V12: шаг печати, ₽ — устав §5: ≈1 % цены (у семейства 0,8–1,6 %); он же порог «устоялось»
    diagnostics: median
    search_tol_rub: 0.01                                       # стоп поисков по медиане, ₽ — десятая шага печати (у Т 0,5 при шаге 5)
    jump_guard: {median_pct: 0.08, v0_pct: 0.08}               # защита заголовка, доли цены [В: как в книгах Т и Сбера]
    ceiling_x_market: 3.0                                      # потолок заголовка, кратных цене [В: как у Т]
  sensitivities: {cor_pp: 0.001, nim_pp: 0.001, roe_pp: 0.01, buffer_pp: 0.01, rank_window: [0.40, 0.60]}
                                                               # A-V13: шаги строк «₽ за 0,1 п.п. CoR / 0,1 п.п. ЧПМ / 1 п.п. ROE / 1 п.п. запаса» (MODEL §8.3), как у Т
  uncertainty:
    draws: 2000
    seed: 20261020                                             # дата книги ГГГГММДД
    quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]
    median_draws: 200
    reverse_bounds: follow_center
    median_refine: 2
    axes:                                                      # оси полосы — устав §3 и листы этапа 1 (решения № 1); оси Т без смысла у Совкомбанка (пакет Яндекса,
                                                               #   скорость схода ЧПМ, дисконт за управление) сняты
      - {name: "ЧПМ мира N на составе якоря (опр. банка 6,92–7,28 %; ключ ядра)", kind: shift, paths: [nii.nim_lt_target_mgmt], low: -0.002594, high: 0.001142, dist: triangular, unit: pp}
                                                               # устав §3 и решения № 1, п. 1: способы переноса окна L, прошедшие бэктест, 6,92 … 7,28 % опр. банка; концы в ключе ядра
                                                               #   0,070371 … 0,074107 — точным мостом (банк × R − ife_N × l_ins) / b; ВЫВОДИТ КОМАНДА (шаг bridge). Вид shift —
                                                               #   ось-связка β книги страховых тоже двигает ключ (приращения складываются, MODEL §10)
      - {name: "Передача ключевой в ЧПМ (опр. банка −0,15…+0,03; базис движка)", kind: shift, paths: [nii.transmission.target], low: -0.077976, high: 0.077977, dist: triangular, unit: number}
                                                               # устав §3: регрессия history −0,15…+0,03 в опр. банка; в базис движка — банк × R − β_ins × l_ins: −0,157171 … −0,001218
                                                               #   (ВЫВОДИТ КОМАНДА, шаг bridge); вид shift — как у оси уровня
      - {name: "Стоимость риска сквозь цикл: сдвиг уровня всех режимов", kind: shift, paths: [regimes.soft.cor.LT, regimes.norm.cor.LT, regimes.downturn.cor.LT, regimes.crisis.cor.LT], low: -0.0035, high: 0.006, dist: triangular, unit: pp}
                                                               # лист pnl: ось LT −0,35…+0,6 п.п. (асимметрия — розничный хвост: этап 3 ФЛ 7 %, покрытие 51 %)
      - {name: "Стоимость риска к реальной ставке: перенос уровня окна в другие миры", kind: value, paths: [credit.kappa], low: 0.0, high: 0.17, dist: triangular, unit: number}
      - {name: "Вероятности режимов (P(кризис) 10–25 %)", kind: dict, paths: [joint.regime_prob], low: {soft: 0.3706, norm: 0.3176, downturn: 0.2118, crisis: 0.10}, high: {soft: 0.3088, norm: 0.2647, downturn: 0.1765, crisis: 0.25}, dist: triangular}
                                                               # концы: вероятность кризиса 10 и 25 %, остальные — пропорционально книге (лист pnl)
      - {name: "Кризис: сдвиг CoR 2027", kind: shift, paths: [regimes.crisis.cor.2027, regimes.crisis.cor.2027Q1, regimes.crisis.cor.2027Q2, regimes.crisis.cor.2027Q3, regimes.crisis.cor.2027Q4], low: -0.009, high: 0.009, dist: triangular, unit: pp}
                                                               # лист pnl: кризисные годы 3,97…5,76 % (центр 4,9 %)
      - {name: "Спад: сдвиг CoR 2027", kind: shift, paths: [regimes.downturn.cor.2027, regimes.downturn.cor.2027Q1, regimes.downturn.cor.2027Q2, regimes.downturn.cor.2027Q3, regimes.downturn.cor.2027Q4], low: -0.005, high: 0.005, dist: triangular, unit: pp}
                                                               # напряжённый класс устава 3,0–4,0 % (центр 3,5 %)
      - {name: "Кризис: сдвиг ЧПМ 2027 (базис движка)", kind: value, paths: [regimes.crisis.nim_shift.2027], low: -0.0171, high: -0.0073, dist: triangular, unit: pp}
                                                               # решения № 1, п. 8: два прочтения эпизода 2022 года — «только остаток» … «остаток и ставочная часть» (мост R_iea)
      - {name: "Кризис: разовый убыток", kind: value, paths: [regimes.crisis.one_off_loss.amount], low: -74.0, high: 0.0, dist: triangular, unit: bn}
      - {name: "Кризис: роспуск макронадбавок", kind: value, paths: [regimes.crisis.rwa_density_mult.2027], low: 0.93, high: 1.00, dist: triangular, unit: number}
      - {name: "Расходы к средним активам (3,42–4,05 %): реальный рост 2027–2030", kind: shift, paths: [opex.real_growth.2027, opex.real_growth.2028, opex.real_growth.2029, opex.real_growth.2030], low: -0.01, high: 0.01, dist: triangular, unit: pp}
                                                               # ВЫВОДИТСЯ НА ЯДРЕ: концы — сдвиг ключей 2027–2030, при котором расходы к средним активам слоя «рыночные ставки как
                                                               #   есть» в 2030 году — 3,42 и 4,05 % (кварталы окна R, устав §3)
      - {name: "Комиссии к средним активам (0,87–1,56 %): рост к формуле связи 2027–2030", kind: shift, paths: [fees.growth_vs_wages.2027, fees.growth_vs_wages.2028, fees.growth_vs_wages.2029, fees.growth_vs_wages.2030], low: -0.01, high: 0.01, dist: triangular, unit: pp}
                                                               # ВЫВОДИТСЯ НА ЯДРЕ: концы — уровень 2030 года на кварталах окна R с резервом по гарантиям 0,87 и 1,56 % (решения № 1, п. 4)
      - {name: "Страхование и небанковское к средним активам (0,90–2,09 %): рост к зарплатам 2027–2030", kind: shift, paths: [other.insurance_growth_vs_wages.2027, other.insurance_growth_vs_wages.2027Q1, other.insurance_growth_vs_wages.2027Q2, other.insurance_growth_vs_wages.2027Q3, other.insurance_growth_vs_wages.2027Q4, other.insurance_growth_vs_wages.2028, other.insurance_growth_vs_wages.2029, other.insurance_growth_vs_wages.2030], low: -0.02, high: 0.02, dist: triangular, unit: pp}
                                                               # ВЫВОДИТСЯ НА ЯДРЕ: концы — уровень 2030 года на кварталах окна R без финансовых расходов 0,90 и 2,09 % (решения № 1, п. 6)
      - {name: "Премия роста кредитов к сектору", kind: shift, paths: [volumes.loan_share_drift.corporate, volumes.loan_share_drift.mortgage, volumes.loan_share_drift.retail_other], low: -0.05, high: 0.05, dist: triangular, unit: pp}
      - {name: "Премия роста средств клиентов к сектору (2027–2029)", kind: bundle, paths: [volumes.funds_share_drift.retail.2027, volumes.funds_share_drift.retail.2028, volumes.funds_share_drift.retail.2029, volumes.funds_share_drift.corporate.2027, volumes.funds_share_drift.corporate.2028, volumes.funds_share_drift.corporate.2029], low: {volumes.funds_share_drift.retail.2027: -0.136, volumes.funds_share_drift.retail.2028: -0.107, volumes.funds_share_drift.retail.2029: -0.059, volumes.funds_share_drift.corporate.2027: -0.063, volumes.funds_share_drift.corporate.2028: -0.059, volumes.funds_share_drift.corporate.2029: -0.034}, high: {volumes.funds_share_drift.retail.2027: -0.036, volumes.funds_share_drift.retail.2028: -0.007, volumes.funds_share_drift.retail.2029: 0.001, volumes.funds_share_drift.corporate.2027: 0.037, volumes.funds_share_drift.corporate.2028: 0.041, volumes.funds_share_drift.corporate.2029: 0.026}, dist: triangular, unit: pp}
                                                               # лист nii: ось-связка ±5 п.п. в 2027–2028, ±3 в 2029 вокруг центра; с 2030 года премия равна нулю (класс 5)
      - {name: "Запас менеджмента над требованием (оба норматива)", kind: value, paths: [capital.mgmt_buffer.n20_0, capital.mgmt_buffer.n1_1], low: 0.004, high: 0.014, dist: triangular, unit: pp}
      - {name: "Дрейф плотности RWA до 2027 года", kind: value, paths: [capital.rwa.density_drift_rate], low: -0.029, high: 0.010, dist: triangular, unit: pct}
      - {name: "Инструменты капитала банка (сдвиг пути)", kind: shift, paths: [capital.n20.t2], low: -15.0, high: 15.0, dist: triangular, unit: bn}
      - {name: "Поправка Н1.0 (форма ядра против формы банка)", kind: value, paths: [capital.n20.gap_pp], low: -0.003, high: 0.003, dist: triangular, unit: pp}
      - {name: "Вычет консолидации страховщиков «жёсткого» сценария", kind: value, paths: [capital.reg_scenarios.strict.deduction_pp.n20_0.LT, capital.reg_scenarios.strict.deduction_pp.n1_1.LT], low: 0.0, high: 0.009, dist: triangular, unit: pp}
      - {name: "Признание фонда ССПСД в нормативе", kind: value, paths: [capital.n20.fvoci_recognition], low: 0.25, high: 0.75, dist: triangular, unit: pct}
      - {name: "Отклонение выплаты от центра 20 %", kind: shift, paths: [dividends.payout_deviation], low: -0.10, high: 0.10, dist: triangular, unit: pp}
      - {name: "Выплата избытка капитала ε с прибыли 2028 года", kind: value, paths: [dividends.excess.epsilon], low: 0.0, high: 1.0, dist: triangular, unit: pct}
      - {name: "Выкуп дочкой: нет после 3К2026 … до конца сетки (связка)", kind: bundle, paths: [equity.other_movements.2026Q4, equity.other_movements.2027, equity.other_movements.2028, equity.other_movements.LT, valuation.share_count_adj, dividends.policy.payout.2026, dividends.policy.payout.2027, dividends.policy.payout.LT], low: {equity.other_movements.2026Q4: -3.0, equity.other_movements.2027: -3.0, equity.other_movements.2028: -3.0, equity.other_movements.LT: -3.0, valuation.share_count_adj: -0.36385, dividends.policy.payout.2026: 0.1911, dividends.policy.payout.2027: 0.1816, dividends.policy.payout.LT: 0.1494}, high: {equity.other_movements.2026Q4: 0.0, equity.other_movements.2027: 0.0, equity.other_movements.2028: 0.0, equity.other_movements.LT: 0.0, valuation.share_count_adj: -0.00887, dividends.policy.payout.2026: 0.1988, dividends.policy.payout.2027: 0.1988, dividends.policy.payout.LT: 0.1988}, dist: triangular, unit: number}
                                                               # лист capital: три ключа одного суждения идут вместе; низ — до конца сетки по форвардной цене, верх — выкупа нет после 3К2026
      - {name: "Книга страховых обязательств: β 0,58–0,72 (связка со спредом, уровнем и передачей)", kind: bundle, paths: [nii.books.insurance_liab.beta, nii.books.insurance_liab.spread.2026, nii.books.insurance_liab.spread.2027, nii.books.insurance_liab.spread.2028, nii.books.insurance_liab.spread.2029, nii.books.insurance_liab.spread.2030, nii.books.insurance_liab.spread.LT, nii.nim_lt_target_mgmt, nii.transmission.target], low: {nii.books.insurance_liab.beta: 0.58, nii.books.insurance_liab.spread.2026: -0.02646, nii.books.insurance_liab.spread.2027: -0.02323, nii.books.insurance_liab.spread.2028: -0.0200, nii.books.insurance_liab.spread.2029: -0.0200, nii.books.insurance_liab.spread.2030: -0.0200, nii.books.insurance_liab.spread.LT: -0.0200, nii.nim_lt_target_mgmt: 0.073074, nii.transmission.target: -0.076264}, high: {nii.books.insurance_liab.beta: 0.72, nii.books.insurance_liab.spread.2026: -0.04606, nii.books.insurance_liab.spread.2027: -0.04538, nii.books.insurance_liab.spread.2028: -0.0447, nii.books.insurance_liab.spread.2029: -0.0447, nii.books.insurance_liab.spread.2030: -0.0447, nii.books.insurance_liab.spread.LT: -0.0447, nii.nim_lt_target_mgmt: 0.073751, nii.transmission.target: -0.082125}, dist: triangular, unit: number}
                                                               # решения № 1, п. 6 (ось β 0,58–0,72) в форме класса 4 (поток sheetsfix, флаг 3): β и спред подбора книги идут вместе
                                                               #   (−2,00 / −4,47 п.п.), ближние ключи — правило A-N1n от ставки якоря 5,47 %; ключ уровня и цель передачи — тот же
                                                               #   7,17 % и −0,06 опр. банка через точный мост при β конца
      - {name: "Угасание избыточной доходности", kind: value, paths: [valuation.terminal.fade], low: 0.25, high: 1.0, dist: triangular, unit: number}
      - {name: "β_E", kind: value, paths: [valuation.beta_e], low: 0.70, high: 1.10, dist: triangular, unit: number}
      - {name: "ERP", kind: value, paths: [valuation.erp], low: 0.049, high: 0.062, dist: triangular, unit: pct}
      - {name: "Реальный рост терминала", kind: value, paths: [valuation.terminal.real_growth], low: 0.005, high: 0.025, dist: triangular, unit: pct}
      - {name: "Налог: эффективная ставка 22–25 %", kind: value, paths: [tax.effective_gap], low: -0.03, high: 0.0, dist: triangular, unit: pp}
      - {name: "Разовый налог: вероятность", kind: value, paths: [tax.one_off.prob], low: 0.0, high: 0.30, dist: triangular, unit: pct}
      - {name: "Бумаги, валюта и прочее (цены 2026)", kind: shift, paths: [other.misc_net_real], low: -4.0, high: 4.0, dist: triangular, unit: bn}
                                                               # лист pnl: уровень 0,26–0,45 % активов (годы окна без разовых 0,28–0,41 %)
      - {name: "Доля неконтролирующих акционеров в прибыли", kind: value, paths: [pnl.nci_share], low: 0.035, high: 0.081, dist: triangular, unit: pct}
      - {name: "Веса миров", kind: dict, paths: [joint.world_prob], low: {N: 0.25, H: 0.50, M: 0.25}, high: {N: 0.40, H: 0.45, M: 0.15}, dist: triangular}   # запись семейства (как у Т)
      - {name: "Инфляция мира M", kind: shift, paths: [worlds.M.cpi, worlds.M.wage_growth, worlds.M.lt_inflation], low: -0.003, high: 0.005, dist: triangular, unit: pp}   # запись семейства (как у Т)
      - {name: "Сдвиг уровня маржи: доля на кредитных книгах (A-N7)", kind: value, paths: [nii.sigma0_split], low: 0.0, high: 1.0, dist: triangular, unit: pct}
                                                               # ВЫВОДИТСЯ НА ЯДРЕ: низ — весь сдвиг на средствах клиентов; верх — значение книги
      - {name: "Сжатие маржи при высокой ставке: доля на кредитных книгах (A-N8)", kind: value, paths: [nii.phi_split], low: 0.35, high: 0.72, dist: triangular, unit: pct}
                                                               # ВЫВОДИТСЯ НА ЯДРЕ: верх — предел гейта пола спреда; низ — порог гейта стоимости средств клиентов (лист nii 0,35 … 0,72)
      - {name: "Доля текущих счетов: чувствительность к ключевой (ψ)", kind: value, paths: [nii.retail_current_share.psi], low: 0.0, high: 0.21, dist: triangular, unit: number}
                                                               # лист nii: динамический подбор 0,00 … регрессия уровней 0,21
      - {name: "LT-спред оптового фондирования", kind: value, paths: [nii.books.wholesale.spread.LT], low: -0.0098, high: 0.0077, dist: triangular, unit: pp}
                                                               # лист nii: депозиты юрлиц (ключевая − 0,98 п.п.) … облигации (+0,77 п.п.)
      - {name: "Дюрация ССПСД", kind: value, paths: [oci.fvoci_duration], low: 1.3, high: 2.7, dist: triangular, unit: years}
      - {name: "Срок подтягивания ССПСД", kind: value, paths: [oci.fvoci_maturity], low: 5.0, high: 10.0, dist: triangular, unit: years}
      - {name: "Дюрация облигаций ССПУ", kind: value, paths: [oci.fvtpl_bond_duration], low: 0.6, high: 2.7, dist: triangular, unit: years}
    off_band_axes: []
  reverse_dcf:                                                 # обратный расчёт медианы (MODEL §11): строки — главные суждения устава; рублёвые допуски — пропорционально шагу печати Т
    subsample: 200
    edge_refine_rub: 0.1                                       # шаг печати (у Т 5,0 при шаге 5 ₽)
    axis_follow: both
    refine_rows: [nii.nim_lt_target_mgmt, "regimes.*.cor.LT"]
    axes:
      - {name: "ЧПМ мира N на составе якоря (ключ ядра)", kind: value, paths: [nii.nim_lt_target_mgmt], search: [0.04, 0.11], range: [0.070371, 0.074107], unit: "%"}
      - {name: "CoR сквозь цикл (сдвиг LT)", kind: shift, paths: [regimes.soft.cor.LT, regimes.norm.cor.LT, regimes.downturn.cor.LT, regimes.crisis.cor.LT], search: [-0.02, 0.06], range: [-0.0035, 0.006], unit: "п.п."}
      - {name: "Передача ставки в ЧПМ (базис движка)", kind: value, paths: [nii.transmission.target], search: [-0.40, 0.30], range: [-0.157171, -0.001218], unit: ""}
      - {name: "Запас над требованием норматива", kind: value, paths: [capital.mgmt_buffer.n20_0, capital.mgmt_buffer.n1_1], search: [0.0, 0.06], range: [0.004, 0.014], unit: "п.п."}
      - {name: "Выплата (отклонение доли от центра)", kind: shift, paths: [dividends.payout_deviation], search: [-0.17, 0.80], range: [-0.10, 0.10], unit: "п.п."}
      - {name: "β_E", kind: value, paths: [valuation.beta_e], search: [0.3, 3.5], range: [0.70, 1.10], unit: ""}
