# Манифест приёма миров ставок семейства 850 — книга Совкомбанка (команда ops/tools/adopt_worlds.py).
#
# Что из версии миров копируется в дерево, какие ключи книги пишутся из индекса источника, какие числа книги
# зависят от миров и каким правилом этой книги пересчитываются, какие команды пересобирают книгу, таблицы, тексты и
# эталоны тестов. Правится руками вместе с кодом книги; на какой версии стоит книга — data/assumptions/worlds_state.json
# (пишет команда). Сторож tests/test_worlds_dependents.py: каждый лист и инструмент, читающий миры, назван здесь в
# `readers`; правила манифеста на мирах книги дают числа шаблона.
schema: worlds-dependents-v1
model: svcb
title: "Совкомбанк 850"
book_gen: "Совкомбанка"                  # имя книги в описании рецепта и строке 1 входов (<<book_gen>>)
print_step: 0.1                          # шаг печати медианы на витрине, ₽ (печать 14,8)
stop: {median_print_steps: 2}            # сдвиг медианы больше двух шагов печати — красный флаг
workers_env: [BANK_WORKERS]
workers: 2                               # общая машина: тяжёлые прогоны — два процесса
# личность коммитов команды — переменные ADOPT_GIT_NAME, ADOPT_GIT_EMAIL (почты в публичном дереве нет), иначе git_identity
# манифеста, иначе настройки git репозитория
record: data/assumptions/worlds_source.json
overlay: data/assumptions/worlds_bank.json
template: data/assumptions/assumptions_template.yaml
report_files: {walk: var/adopt/walk.json}  # прогулка версии — в отчёт команды (причина сдвига медианы строками прогулки)
book_version: meta.version                # номер книги: команда пишет в состояние «с какой → какая» (младший разряд + 1)

steps:
  # ---------------------------------------------------------------- файлы версии
  - id: record
    kind: install
    title: "запись миров {version} побайтово, рецепт, входы, описание рецепта"
    walk: {order: 1, name: "{labels.walk_step}: запись миров {version} — пути N/H/M, кривые, уровень кривой в терминале, дата кривых", keys: [worlds.N, worlds.H, worlds.M, worlds.source, meta.curve_as_of]}
    files:
      - {src: record/worlds_source.json, dst: data/assumptions/worlds_source.json}
      - {src: record/worlds_source.csv, dst: data/assumptions/worlds_source.csv}
      - {src: recipe/worlds_recipe.py, dst: data/assumptions/worlds_recipe.py}
      - src: inputs/worlds_inputs.yaml
        dst: data/assumptions/worlds_inputs.yaml
        verify: body
        keep_lines: [1]
        own_lines: {1: "# Входы записи для сборки макро-миров — книга-источник (850oa) (WORLDS-RECIPE.md); копия общей записи {record.curve_date_ru} для книги Совкомбанка (DESIGN §3.3)."}
      - {src: doc/WORLDS-RECIPE.md, dst: data/assumptions/WORLDS-RECIPE.md, verify: result, subst: {"<<book_gen>>": "{book_gen}"}}
  - id: overlay
    kind: install
    title: "надстройка банков {version}: лист сектора семейства и worlds_bank.json"
    walk: {order: 2, name: "{labels.walk_step}: банковская надстройка {version} — рост сектора по мирам", keys: [worlds_bank, worlds.overlay]}
    files:
      - {src: bank/sector_sheet.yaml, dst: data/assumptions/evidence/worlds_bank/inputs/bank_overlay_draft.yaml, verify: result, keep_head: true}
      - {src: bank/worlds_bank.json, dst: data/assumptions/worlds_bank.json}
  - id: state
    kind: state
    title: "состояние: книга на мирах {version}"
  - id: recipe-check
    kind: run
    title: "рецепт воспроизводит запись {version}"
    cmd: ["{python}", "-B", "data/assumptions/worlds_recipe.py", "--check"]
  - id: overlay-check
    kind: run
    title: "сборщик надстройки воспроизводит worlds_bank.json"
    cmd: ["{python}", "-B", "data/assumptions/evidence/worlds_bank/build_overlay.py", "--check"]

  # ---------------------------------------------------------------- ключи происхождения
  - id: provenance
    kind: set
    title: "шаблон: дата кривых, происхождение и хэш записи {version}"
    file: data/assumptions/assumptions_template.yaml
    values:
      meta.curve_as_of: "{record.curve_date}"
      worlds.source.origin: "{origin}"
      worlds.source.record_asof: "{record.asof}"
      worlds.source.curve_date: "{record.curve_date}"
      worlds.source.sha256: "{record.sha256}"
    replace:                                 # подписи версии миров: на витрине «[Ф: … — magnit-850oa book-1.x]», в документах книги
      "{from.origin}": "{origin}"
      "кривая {from.record.curve_date_ru}": "кривая {record.curve_date_ru}"
      "дата записи {from.record.asof_ru}": "дата записи {record.asof_ru}"
      "{from.record.sha256}": "{record.sha256}"
      "{from.record.sha8}…": "{record.sha8}…"
      "{from.overlay.sha8}…": "{overlay.sha8}…"
    replace_in: [data/assumptions/assumptions_template.yaml, data/assumptions/README.md, data/assumptions/ASSUMPTIONS-BOOK.md,
                 data/assumptions/evidence/worlds_bank/README.md]

  - id: book-version
    kind: set
    title: "версия книги {book.version} (было {book.from}; дата, оценка, цена и зерно — без изменений)"
    file: data/assumptions/assumptions_template.yaml
    values: {meta.version: "{book.version}"}
    walk: {order: 99, name: "Версия книги {book.version}", keys: [meta.version]}

  # ---------------------------------------------------------------- правила книги (ops/tools/worlds_rules.py)
  - id: far-spreads
    kind: rule
    title: "дальние ключи спредов книг активов 2028–2030 и LT на опоре мира H (лист калибровки ЧПД)"
    module: ops/tools/worlds_rules.py
    function: far_spreads
    walk: {order: 3, name: "{labels.walk_step}: ключи спредов книг на опоре мира H {version} (ближние A-N1n и дальние — правило листа калибровки ЧПД)", keys: [nii.books]}
  - id: cor-paths
    kind: rule
    title: "пути стоимости риска режимов и концы оси κ — перенос κ по реальной ставке мира M"
    module: ops/tools/worlds_rules.py
    function: cor_paths
    walk: {order: 4, name: "{labels.walk_step}: пути стоимости риска режимов — перенос κ по реальной ставке мира M", keys: [regimes.soft.cor, regimes.norm.cor, regimes.downturn.cor, regimes.crisis.cor]}
  - id: bridge-variants
    kind: rule
    title: "ключ уровня маржи вариантов «другой уровень мира» — мостом листа при ключевой мира"
    module: ops/tools/worlds_rules.py
    function: bridge_variants

  # ---------------------------------------------------------------- сборка и вывод на ядре
  - id: build
    kind: run
    title: "машинная книга из шаблона, записи и надстройки"
    cmd: ["{python}", "-B", "data/assumptions/build_assumptions.py"]
  - id: rederive
    kind: run
    title: "вывод на ядре: ближние ключи, корни, концы осей, варианты, пороги по правилу листа"
    cmd: ["{python}", "-B", "ops/tools/rederive.py", "--no-quick", "--no-classes", "--workers", "2", "--label", "adopt-{version}-1"]
    timeout: 5400
    walk: {order: 5, name: "{labels.walk_step}: числа, выведенные на ядре, концы осей и справочные варианты", rest: true}
  - id: premium-loop
    kind: loop
    title: "центр премии средств клиентов и повтор вывода — до неподвижной точки"
    max: 3
    steps:
      - id: funds-premium
        kind: rule
        title: "центр премии роста средств клиентов: середина фактов и нужды баланса (класс 6)"
        module: ops/tools/worlds_rules.py
        function: funds_premium
        walk: {order: 6, name: "{labels.walk_step}: центр премии роста средств клиентов на нужде баланса книги", keys: [volumes.funds_share_drift]}
      - id: rederive-again
        kind: run
        title: "повтор вывода на ядре на новом центре премии («изменений нет» — сошлось)"
        cmd: ["{python}", "-B", "ops/tools/rederive.py", "--no-quick", "--no-classes", "--workers", "2", "--label", "adopt-{version}-loop"]
        timeout: 5400
  - id: build-check
    kind: run
    title: "машинная книга воспроизводится сборкой"
    cmd: ["{python}", "-B", "data/assumptions/build_assumptions.py", "--check"]
  - id: refresh-check
    kind: run
    title: "запись, книга, ближние и дальние ключи спредов согласованы"
    cmd: ["{python}", "-B", "ops/tools/refresh_worlds.py", "--check"]
  - id: class-6
    kind: run
    title: "центры суждений равны правилам устава (класс 6: пути CoR, премия, уровень маржи — правила книги)"
    cmd: ["{python}", "-B", "ops/tools/class_checks.py", "--only", "6", "--quiet", "--json", "var/adopt/{version}/class6.json"]
    timeout: 1800
  - id: class-checks
    kind: run
    title: "проверки классов ошибок в модели (все шесть); срабатывание — красный флаг отчёта, не остановка"
    cmd: ["{python}", "-B", "ops/tools/class_checks.py", "--workers", "2", "--quiet", "--json", "var/adopt/{version}/class_checks.json"]
    ok: [0, 1]
    flags: {file: "var/adopt/{version}/class_checks.json", path: flags}
    timeout: 1800

  # ---------------------------------------------------------------- развилки, таблицы, контроль (после последней правки книги)
  - id: forks
    kind: run
    title: "развилки сухим перевыводом (все варианты, замыкания, база) и запись forks_rd.json"
    cmd: ["{python}", "-B", "ops/tools/forks_all.py", "--threads", "2", "--workers", "2", "--reuse"]
    skip_if: ["{python}", "-B", "ops/tools/forks.py", "--check"]
    timeout: 21600
  - id: tables
    kind: run
    title: "таблицы книги полной полосой (results.json, run_output.txt)"
    cmd: ["{python}", "-B", "-m", "model.book_results"]
    skip_if: ["{python}", "-B", "ops/tools/quick_numbers.py", "--check-tables"]
    timeout: 10800
  - id: control
    kind: run
    title: "сводка контрольной модели (data/checks/control_model.json)"
    cmd: ["{python}", "-B", "-m", "tests.test_control_model", "--write"]
    # сводка несёт день и коммит счёта: на той же книге и том же коде шаг не повторяется (неподвижная точка)
    skip_if: ["{python}", "-B", "ops/tools/adopt_fresh.py", "data/checks/control_model.json", "commit",
              "data/assumptions/assumptions.json", "data/facts", "model", "tests/independent_model.py", "tests/test_control_model.py"]
    timeout: 3600
  - id: marginal
    kind: run
    title: "запись листа предельной экономики роста (evidence/path/out/marginal_loan_out.*)"
    cmd: ["{python}", "-B", "data/assumptions/evidence/path/marginal_loan.py"]
    timeout: 1800
  - id: gates
    kind: gates
    title: "сработавшие гейты таблиц книги"
    file: data/assumptions/results.json
    path: checks
    flag: fired
    where: {kind: gate}
  - id: gate-texts
    kind: run
    title: "объяснения сработавших гейтов числами книги (шаблон ops/tools/gate_texts.py)"
    cmd: ["{python}", "-B", "ops/tools/gate_texts.py", "--write", "--flags", "var/adopt/{version}/gate_flags.json"]
    flags: var/adopt/{version}/gate_flags.json
    timeout: 1800
  - id: walk
    kind: run
    title: "прогулка {book.from} → {book.version} по шагам манифеста (точка и медиана малой полосы)"
    cmd: ["{python}", "-B", "ops/tools/adopt_walk.py", "--median", "--draws", "400"]
    timeout: 5400
  - id: docs
    kind: run
    title: "документы версии: календарь отказов, открытый вопрос о мирах, V{book.version}-CHANGES.md, журнал изменений"
    cmd: ["{python}", "-B", "ops/tools/adopt_docs.py"]
  - id: render
    kind: run
    title: "числа документов метками из таблиц книги и сводки контроля"
    cmd: ["{python}", "-B", "ops/tools/render_numbers.py"]
  - id: render-check
    kind: run
    title: "документы равны таблицам книги"
    cmd: ["{python}", "-B", "ops/tools/render_numbers.py", "--check"]
  - id: quick
    kind: quick
    title: "быстрые числа книги (до и после приёма)"
    cmd: ["{python}", "-B", "ops/tools/quick_numbers.py", "--out", "var/adopt/{version}/quick.json", "--runs", "400", "--workers", "2"]
    out: var/adopt/{version}/quick.json
    timeout: 3600

  # ---------------------------------------------------------------- тесты
  - id: tests-book
    kind: run
    title: "книжные тесты, сторож приёма, инструменты и документы"
    cmd: ["{python}", "-B", "-m", "pytest", "--basetemp=var/pytest-book", "-p", "no:cacheprovider", "-q", "-x",
          "tests/test_book_core.py", "tests/test_book_evidence.py", "tests/test_book_forks.py", "tests/test_book_gates.py",
          "tests/test_book_sheet_backtest_path.py", "tests/test_book_template.py", "tests/test_book_texts.py",
          "tests/test_book_worlds.py", "tests/test_worlds_dependents.py", "tests/test_ops_tools.py", "tests/test_ops_docs.py"]
    timeout: 7200

# Листы и инструменты, которые читают запись миров, надстройку или их копии (сторож тестов сверяет список с деревом).
# feeds — ключи шаблона из их выхода; пусто — печать или проверка.
readers:
  data/assumptions/build_assumptions.py: {feeds: ["worlds.<W>.*", "worlds_bank.<W>.*"], step: build}
  data/assumptions/worlds_recipe.py: {feeds: [], step: recipe-check}
  data/assumptions/evidence/worlds_bank/build_overlay.py: {feeds: [worlds_bank.json], step: overlay-check}
  ops/tools/refresh_worlds.py: {feeds: [], step: refresh-check}
  ops/tools/adopt_worlds.py: {feeds: [], step: ""}
  ops/tools/worlds_rules.py: {feeds: ["nii.books.<активы>.spread.2028–LT", "regimes.<R>.cor.2027–LT", "ось κ", "volumes.funds_share_drift.*", "варианты уровня маржи"], step: far-spreads}
  ops/tools/adopt_docs.py: {feeds: [], step: docs}                 # документы версии: блок book состояния
  ops/tools/adopt_walk.py: {feeds: [], step: walk}                   # прогулка версии: старт — книга коммита из состояния
  model/payload.py: {feeds: [], step: ""}                  # печать происхождения записи на витрине (читает книгу)
