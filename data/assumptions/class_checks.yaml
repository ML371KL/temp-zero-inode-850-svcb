  # ---- интеграция круга 3 (проход ядра 2; решения ведущего № 3, Р4, Р5, Р7; значения — svcb-850-handoff/stage1/round3/new_keys.yaml):
  #      центры ключей К1, К3, К5 и концы оси К3 — формулами от фактов; ccf К5 — середина диапазона 199-И (без проверки первичкой)
  - {key: dividends.min_dps.LT, rule: facts, type: "факт", expr: "min([F('dividends', 'history')[-2]['dps']['v'], F('dividends', 'history')[-1]['dps']['v']])", tol: 1e-09, source: "решения № 3, Р5 (К1): жетон DPS — наименьший DPS двух последних лет по фактам (за 2024 и 2025 годы — 0,35 и 0,35 ₽)"}
  - {key: volumes.wholesale_structural_to_funds, rule: facts, type: "В", expr: "mid((F('balance', 'wholesale', 'issued_debt') + F('balance', 'wholesale', 'subordinated')) / (F('balance', 'funds', 'total') + (0.0 if O('volumes.funds_scope') == 'clients' and O('volumes.liability_drivers') else F('balance', 'insurance', 'contract_liabilities'))), (F('balance', 'wholesale', 'cbr') + F('balance', 'wholesale', 'banks') + F('balance', 'wholesale', 'issued_debt') + F('balance', 'wholesale', 'subordinated') + F('balance', 'wholesale', 'other_borrowed')) / (F('balance', 'funds', 'total') + (0.0 if O('volumes.funds_scope') == 'clients' and O('volumes.liability_drivers') else F('balance', 'insurance', 'contract_liabilities'))))", tol: 5e-05, source: "Р11-2 (проход ядра 9): знаменатель — средства клиентов без книги страховых при volumes.funds_scope: clients (тип В, центр 0,0969), иначе средства ядра; решения № 3, Р4 (К3): середина свидетельств — облигации и субординированный долг / средства ядра (0,0437) … весь опт якоря / средства ядра (0,1403); запись до 0,001"}
  - {key: "ось К3: low", rule: facts, type: "В", book_expr: "[a for a in B('valuation.uncertainty.axes') if a['paths'][0] == 'volumes.wholesale_structural_to_funds'][0]['low']", expr: "(F('balance', 'wholesale', 'issued_debt') + F('balance', 'wholesale', 'subordinated')) / (F('balance', 'funds', 'total') + (0.0 if O('volumes.funds_scope') == 'clients' and O('volumes.liability_drivers') else F('balance', 'insurance', 'contract_liabilities')))", tol: 5e-05, source: "решения № 3, Р4 (К3, класс 4): ось — сам диапазон свидетельств; низ — облигации и субординированный долг к средствам ядра; Р11-2: при volumes.funds_scope: clients — к средствам клиентов без книги страховых"}
  - {key: "ось К3: high", rule: facts, type: "В", book_expr: "[a for a in B('valuation.uncertainty.axes') if a['paths'][0] == 'volumes.wholesale_structural_to_funds'][0]['high']", expr: "round((F('balance', 'wholesale', 'cbr') + F('balance', 'wholesale', 'banks') + F('balance', 'wholesale', 'issued_debt') + F('balance', 'wholesale', 'subordinated') + F('balance', 'wholesale', 'other_borrowed')) / (F('balance', 'funds', 'total') + (0.0 if O('volumes.funds_scope') == 'clients' and O('volumes.liability_drivers') else F('balance', 'insurance', 'contract_liabilities'))) - 0.00005, 4)", tol: 5e-05, source: "решения № 3, Р4 (К3, класс 4): верх — весь опт якоря к средствам ядра; Р11-2 (проход ядра 9): при volumes.funds_scope: clients — к средствам клиентов без книги страховых, запись вниз до 4 знаков (F4 методики: s выше доли якоря — отказ ядра)"}
  - {key: capital.rwa.guarantees.ccf.nonfinancial, rule: midpoint, type: "В", lo: 0.35, hi: 0.5, tol: 1e-09, source: "решения № 3, Р7 (К5): CCF нефинансовых гарантий по 199-И — середина 0,35…0,5 (без проверки первичкой); ось — сам диапазон"}
  - {key: capital.rwa.guarantees.weight, rule: facts, type: "факт", expr: "B('capital.rwa.density')['auto']", tol: 1e-09, source: "решения № 3, Р7 (К5): вес риска 100 % × масштаб калибровки RWA книги — плотность книги с весом 100 % (auto)"}
  # ---- решения ведущего № 4, Р4-3 (итог скептика econ3-classes круга 4, класс 6; поток book4): ПЕРИМЕТР ОКНА R = ПЕРИМЕТР ЯКОРЯ.
  #      Ряд поправок периметра — узел фактов perimeter.json (лист svcb-850-handoff/stage1/round4/perimeter_series.py); лист вывода
  #      вносит его одной функцией в окно R, свидетельство «2П года якоря» и цель роста года якоря. Правила: (а) каждый квартал окна R и
  #      года якоря с выгодной покупкой или резервом «первого дня» (pnl_quarterly.noncore_parts) несёт строку ряда (поправку или
  #      явный ноль с причиной; нераскрытые сделки 3К и 4К2025 — строки со статусом НП, поправки нет); (б) у каждого лица ряда есть
  #      строка или явный ноль по каждой строке ОПУ, которой оно касается (entities.<лицо>.lines); (в) ступени периметра в прогнозе
  #      (2027К1, 2027К2 страхования и расходов) — из того же ряда (класс 1): поправка квартала года якоря / |факт строки квартала|
  #      (ключи книги записаны 4 знаками — допуск 1e-4)
  - {key: "периметр: кварталы окна R и года якоря с выгодной покупкой или резервом первого дня без строки ряда", rule: facts, type: "тождество", book_expr: "sum([1 for p, q in F('pnl_quarterly', 'quarters').items() if '2024Q2' <= p <= '2026Q4' and (abs(q.get('noncore_parts', {}).get('bargain_gain', {}).get('v', 0.0)) > 0 or abs(q.get('noncore_parts', {}).get('day1_ecl_acquired', {}).get('v', 0.0)) > 0) and not (p in F('perimeter', 'events') and [r for r in F('perimeter', 'rows') if F('perimeter', 'events')[p]['entity'] in r['entity'].split('+')])])", expr: "0", tol: 0.0, source: "решения № 4, Р4-3; скептик econ3-classes (круг 4): строки ряда для каждого квартала окна и года якоря со сделкой — 2024К2–К4 (уточнения ХКФ), 2025К1 (золотодобытчик), 2025К2, 2025К3 и 2025К4 (НП), 2026К1–К2 (КЛСЖ, КЛМС)"}
  - {key: "периметр: строки ОПУ лиц без строки ряда или явного нуля", rule: facts, type: "тождество", book_expr: "sum([1 for e, d in F('perimeter', 'entities').items() for ln in d['lines'] if not [r for r in F('perimeter', 'rows') if e in r['entity'].split('+') and r['line'] == ln]])", expr: "0", tol: 0.0, source: "решения № 4, Р4-3; скептик econ3-classes: пара каждого лица — на всех строках, которых оно касается (страхование, расходы, комиссии, CoR; у ХКФ — разовые расходы окна)"}
  - {key: "периметр: ступень страхования 2027К1 (КЛСЖ и КЛМС к факту 1К2026)", rule: facts, type: "тождество", book_expr: "B('other.insurance_growth_vs_wages')['2027Q1'] - B('other.insurance_growth_vs_wages')['2028']", expr: "sum([r['centre']['v'] for r in F('perimeter', 'rows') if r['line'] == 'ins' and r['period'] == '2026Q1' and r['scope'] == 'all']) / abs(F('pnl_quarterly', 'quarters')['2026Q1']['insurance_net']['v'])", tol: 1.0e-04, source: "решения № 4, Р4-3; скептик: ступень выводится из того же ряда периметра (класс 1), по датам контроля лиц"}
  - {key: "периметр: ступень страхования 2027К2 (49/91 КЛМС к факту 2К2026)", rule: facts, type: "тождество", book_expr: "B('other.insurance_growth_vs_wages')['2027Q2'] - B('other.insurance_growth_vs_wages')['2028']", expr: "sum([r['centre']['v'] for r in F('perimeter', 'rows') if r['line'] == 'ins' and r['period'] == '2026Q2' and r['scope'] == 'all']) / abs(F('pnl_quarterly', 'quarters')['2026Q2']['insurance_net']['v'])", tol: 1.0e-04, source: "решения № 4, Р4-3: ступень по дате контроля КЛМС (19.05.2026)"}
  - {key: "периметр: ступень расходов 2027К1 (расходы двух страховщиков к факту 1К2026)", rule: facts, type: "тождество", book_expr: "B('opex.real_growth')['2027Q1'] - B('opex.real_growth')['2028']", expr: "sum([r['centre']['v'] for r in F('perimeter', 'rows') if r['line'] == 'opex' and r['period'] == '2026Q1' and r['scope'] == 'all']) / abs(F('pnl_quarterly', 'quarters')['2026Q1']['opex']['v'])", tol: 1.0e-04, source: "решения № 4, Р4-3: тот же ряд у расходов (класс 1)"}
  - {key: "периметр: ступень расходов 2027К2 (49/91 расходов КЛМС к факту 2К2026)", rule: facts, type: "тождество", book_expr: "B('opex.real_growth')['2027Q2'] - B('opex.real_growth')['2028']", expr: "sum([r['centre']['v'] for r in F('perimeter', 'rows') if r['line'] == 'opex' and r['period'] == '2026Q2' and r['scope'] == 'all']) / abs(F('pnl_quarterly', 'quarters')['2026Q2']['opex']['v'])", tol: 1.0e-04, source: "решения № 4, Р4-3: ступень по дате контроля КЛМС"}
  # ---- решения ведущего № 5, Р5-2 и Р5-3 (класс 6 узла фактов perimeter.json; итог проверки экономики econ4-classes круга 4 № 3:
  #      «116 зелёных правил центры узла периметра не покрывают»): центр каждой связки нераскрытой разбивки — СЕРЕДИНА ЕЁ КОНЦОВ
  #      (устав §3; лист svcb-850-handoff/stage1/round5/perimeter_series.py) — у связок (центр — середина НЕокруглённых концов, запись
  #      двумя знаками: допуск 0,01) и у строк ряда (центр строки — середина её концов; у строк выручки КЛМС связки T правило не
  #      применяется: на нижнем конце лица нет — выручка 0, а не расходы + 0,23; эта связь нелинейна по построению). Разовые
  #      расходы интеграции ХКФ (Р5-2): 0 — не свидетельство (банк называет рост расходов 2025 года интеграцией отделений ХКФ),
  #      свидетельства — две оценки (пять статей ОХР 3,62 и спад скользящих 4 кварталов 4,1): связка 3,62…4,1, центр 3,86; сумма
  #      строк окна на каждом конце и в центре — сама связка
  - {key: "периметр: центр связки kl_ins — середина её концов", rule: facts, type: "Д", book_expr: "F('perimeter', 'groups', 'kl_ins', 'centre')", expr: "mid(F('perimeter', 'groups', 'kl_ins', 'low'), F('perimeter', 'groups', 'kl_ins', 'high'))", tol: 0.01, source: "решения № 5, Р5-2, Р5-3; устав §3: центр нераскрытой разбивки — середина её концов (вклад КЛСЖ в страхование 0,44…1,51); запись концов и центра двумя знаками"}
  - {key: "периметр: центр связки T — середина её концов", rule: facts, type: "Д", book_expr: "F('perimeter', 'groups', 'T', 'centre')", expr: "mid(F('perimeter', 'groups', 'T', 'low'), F('perimeter', 'groups', 'T', 'high'))", tol: 0.01, source: "решения № 5, Р5-2, Р5-3; устав §3: центр нераскрытой разбивки — середина её концов (расходы двух страховщиков за полный квартал 1,10…2,38); запись концов и центра двумя знаками"}
  - {key: "периметр: центр связки gold — середина её концов", rule: facts, type: "Д", book_expr: "F('perimeter', 'groups', 'gold', 'centre')", expr: "mid(F('perimeter', 'groups', 'gold', 'low'), F('perimeter', 'groups', 'gold', 'high'))", tol: 0.01, source: "решения № 5, Р5-2, Р5-3; устав §3: центр нераскрытой разбивки — середина её концов (золотодобытчик 0…1,68); запись концов и центра двумя знаками"}
  - {key: "периметр: центр связки hcf — середина её концов", rule: facts, type: "Д", book_expr: "F('perimeter', 'groups', 'hcf', 'centre')", expr: "mid(F('perimeter', 'groups', 'hcf', 'low'), F('perimeter', 'groups', 'hcf', 'high'))", tol: 0.01, source: "решения № 5, Р5-2, Р5-3; устав §3: центр нераскрытой разбивки — середина её концов (разовые расходы интеграции ХКФ 3,62…4,1 (Р5-2)); запись концов и центра двумя знаками"}
  - {key: "периметр: строки связок kl_ins, gold, hcf и расходы T — центр строки посередине её концов", rule: facts, type: "тождество", book_expr: "sum([1 for r in F('perimeter', 'rows') if (r['group'] in ('kl_ins', 'gold', 'hcf') or (r['group'] == 'T' and r['line'] == 'opex')) and abs(r['centre']['v'] - (r['low'] + r['high']) / 2) > 0.006])", expr: "0", tol: 0.0, source: "решения № 5, Р5-2, Р5-3: центр строки ряда — середина её концов (запись строк — двумя знаками у КЛСЖ: 0,97 при концах 0,44 и 1,51)"}
  - {key: "периметр: разовые ХКФ — сумма строк окна (centre) равна связке", rule: facts, type: "тождество", book_expr: "-sum([r['centre']['v'] for r in F('perimeter', 'rows') if r['group'] == 'hcf'])", expr: "F('perimeter', 'groups', 'hcf', 'centre')", tol: 1.0e-06, source: "решения № 5, Р5-2: строки окна несут ровно связку 3,62 / 3,86 / 4,1 (раскладка по кварталам — пять статей ОХР и спад скользящих 4 кварталов, центр — середина раскладок)"}
  - {key: "периметр: разовые ХКФ — сумма строк окна (low) равна связке", rule: facts, type: "тождество", book_expr: "-sum([r['low'] for r in F('perimeter', 'rows') if r['group'] == 'hcf'])", expr: "F('perimeter', 'groups', 'hcf', 'low')", tol: 1.0e-06, source: "решения № 5, Р5-2: строки окна несут ровно связку 3,62 / 3,86 / 4,1 (раскладка по кварталам — пять статей ОХР и спад скользящих 4 кварталов, центр — середина раскладок)"}
