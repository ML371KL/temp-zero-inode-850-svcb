    transmission_centre_regressions: {"what": "центр передачи −0,06 — регрессия и пары кварталов (прямые свидетельства на этой величине), а не стационарный наклон совместного подбора книг +0,092: путь 2023–2026 наклон подбора не определяет (один цикл с «горбом»; пары, гасящие переход, дают −0,05); ошибка бэктеста пути маржи (ii) убывает к верху оси на всех плечах, но внутри оси не проходит нигде — проходит только около +0,09…+0,12, то есть на стационарном наклоне совместного подбора, который путь 2023–2026 не определяет; удержание −0,06 требует стационарных наклонов срочных средств 1,11–1,13 (названное свойство решателя); отклонение печатается с ценой развилки «передача на верху оси» и плечами на ней; середина трёх прочтений (−0,06; −0,052; ≈ +0,10) −0,025 — развилкой", "price_point": null, "price_median": null, "prices": {"передача на верху оси +0,03 (trtop; коридор ±0,20 — Р12-8а)": "+6.2301 / +4.5825 (сухой перевывод; ось НДУ — книги; отбор окон варианта: 2П2025 выпадает (ROE 0.1527 против границы 0.1592) (Р12-8а))", "середина трёх прочтений −0,025 (trmid; лист решения № 12, С-1)": "+2.3263 / +1.7025 (сухой перевывод, своя выборка +1.7575; миры N +0.08, H +1.03, M +3.47; отбор окон не меняется — граница ROE варианта 0.1495)", "плечи (ii) в центре: c подбором / старт от якоря (справочно), п.п.": "L 0,980 / 1,317; W4 0,737 / 1,046; спуск 0,432 / 0,738; C 0,218 / 0,413", "плечи (ii) на середине трёх прочтений (−0,025): c подбором / старт от якоря, п.п.": "L 0,829 / 1,072; W4 0,616 / 0,856; спуск 0,378 / 0,616; C 0,204 / 0,341", "плечи (ii) на верху оси: c подбором / старт от якоря, п.п.": "L 0,540 / 0,654; W4 0,361 / 0,519; спуск 0,257 / 0,415; C 0,157 / 0,221"}, "decision": "решения № 12, Р12-5а (устав §8, PLAYBOOK §2 (б)); лист решения № 12, С-1 (центр −0,06 остаётся, довод — числами) и С-2 ((ii) — определение «c подбором»: уровень судит 1(а), 1(б) судит путь; «старт от якоря» — справочно); итоговая книга круга 12 a148cf8 (раздел И)"}
    transmission_chord_NM: {"what": "передача −0,06 реализована хордой миров N и M; мир H выше N (стационары ЧПМ опр. банка N 7,17 / H 7,21 / M 6,63 %) по нелинейности доли текущих счетов решателя (MODEL §4.5); пары кварталов у 14,5 % дают ≈ +0,02", "price_point": null, "price_median": null, "prices": {"прочтение «H на хорде −0,06» (мир H на 7,02 %)": "≈ −0,43 по точке (оценка чувствительностью сетки: +0,1 п.п. ЧПМ ядра — мир H +0,94…+0,98 ₽, вес H в точке 0,225; без ядра не перевыводится)"}, "decision": "лист решения № 12, С-1 (устав §8); итоговая книга круга 12 a148cf8 (раздел И)"}
  isolation: true
  cells: all
  cell_inputs:
    - {input: cor, size: 0.002}
    - {input: nim_shift, size: 0.001}
    - {input: requirement, size: 0.005}
    - {input: deduction, size: 0.002}
  # Решения ведущего № 3, Р13: подмены выкупа (путь акций и делитель своей клетки), весов М13 и множителей М7 ПО КЛЕТКАМ — в
  # класс 2; входов клетки «buyback», «opex_weights», «cor_mult» у инструмента ops/tools/class_checks.py нет (CELL_INPUTS:
  # cor, nim_shift, requirement, deduction) — нужна правка инструмента (флаг потока book3, круг 3); книжные ключи этих
  # суждений общие для всех клеток, возмущение их через книгу законно меняет все клетки
  book_inputs:
    - {path: "regimes.{regime}.cor", shift: 0.002}
    - {path: "regimes.{regime}.loan_growth_adj", shift: 0.01}
    - {path: "capital.reg_scenarios.{scenario}.ccyb", shift: 0.005}
    - {path: "worlds.M.wage_growth", shift: 0.01}   # решения № 3, Р2: при связи 1 зарплаты мира в строки комиссий, страхования и
                                                   #   расходов не входят (сокращаются в формуле связи) — у миров N и H возмущение
                                                   #   зарплат законно не доходит ни до одной клетки (мёртвый вход по правилу, не
                                                   #   находка); у мира M зарплаты несёт ось инфляции — возмущение остаётся
    - {path: "worlds.{world}.real_key", shift: 0.01}
    - {path: "worlds.{world}.key_rate", shift: 0.005}

# ------------------------------------------------------------------ класс 3: продление явных лет на год
horizon:
  extend_years: 1
  tol_print_steps: 0.5     # устав §8: допуск — полшага печати (0,05 ₽ при шаге 0,1 ₽) по слоям и точке; траектории «растёт с RWA» и
                           #   пути явного участка — на стационаре к последнему году

# ------------------------------------------------------------------ класс 4: ось на той же величине, что центр
axes:
  companions:
    valuation.governance.discount: [valuation.governance.components]

# ------------------------------------------------------------------ класс 5: переходные слагаемые вне окна — нейтральны
# Устав §8: переходные слагаемые (ближний путь маржи, сходящие премии роста, ближние пути режимов) — нулевые после 2029К4,
# кроме названных уставом. Корни уровней расходов, комиссий и страхования к активам — не переходные слагаемые, а уровни: после
# лет групп они равны своему LT (neutral: last) — это проверка стационара к последнему году (класс 3 устава).
transitional:
  - {name: "Ближний сдвиг ЧПМ (regimes.near_nim_shift)", series: near, neutral: 0.0, until: 2029}            # устав §8 и решения № 1, п. 16: 0 с 2030К1
  - {name: "Премия роста кредитов к сектору", series: "loan_drift.*", neutral: 0.0, until: 2029}            # лист nii: LT_from 2030 (класс 5)
  - {name: "Премия роста средств клиентов к сектору", series: "funds_drift.*", neutral: 0.0, until: 2029}   # лист nii: share_drift_until 2029
  - {name: "Поправка роста кредитов режима", series: "regimes.*.loan_adj", neutral: 0.0, until: 2029}      # лист pnl: LT_from 2029–2030
  - {name: "Абсолютный рост кредита кризиса", series: "regimes.*.override", neutral: absent, until: 2028}  # рисковый сценарий ЦБ 2027–2028
  - {name: "Разовый убыток режима", series: "regimes.*.one_off", neutral: 0.0, until: 2027}               # год шока
  - {name: "Множитель RWA режима", series: "regimes.*.rwa_mult", neutral: 1.0, until: 2029}               # 1 с 2030
  - {name: "Сдвиг ЧПМ режима к своему LT", series: "regimes.*.nim_shift", neutral: last, until: 2027}     # кризис: LT_from 2028 (решения № 1, п. 8)
  - {name: "Отклонения A-P2u (CoR и ЧПМ)", series: "deviations.*", neutral: 0.0, until: 2028, tol: 1.0e-6}
  - {name: "Комиссии: корень роста к базе — переход до 2029 года", series: fees_gvw, neutral: 0.0, until: 2029}        # решения № 3, Р2: связь 1, корень 0 с 2030 года (класс 5)
  - {name: "Страхование: корень роста к базе — переход до 2029 года", series: ins_gvw, neutral: 0.0, until: 2029}      # решения № 3, Р2: связь 1, корень 0 с 2030 года (класс 5)
  - {name: "Реальный рост расходов — переход до 2029 года", series: opex_real, neutral: 0.0, until: 2029}            # решения № 3, Р2: связь 1, корень 0 с 2030 года (класс 5)
  - {name: "Спреды книг ЧПД к своему LT", series: "spreads.*", neutral: last, until: 2030}                              # LT_from 2031
  - {name: "Дрейф плотности RWA", series: dn, neutral: last, until: 2027}                                              # density_drift_until
  - {name: "Глиссада требования сверх требования сценария", series: "glide.*", neutral: 0.0, until: 2030}             # последняя ступень пола — 2030
  - {name: "Разовый налог", series: tax_one_off, neutral: 0.0, until: 2027}
  - {name: "Доля неработающих денег: путь от квартала якоря к доле книги (Р6-1)", series: cash_share, neutral: last, until: 2026}   # share_from 2026Q4: c_q = c_Q с 2027К1
  - {name: "Франшиза страхования: корень номинальной части — переход до 2029 года (Р8-6)", series: "share_root.insurance", neutral: 0.0, until: 2029}   # проход ядра 6: κ — LT 0, LT_from 2030
  - {name: "Книга страховых К6: корень номинальной части — переход до 2029 года (Р9-1)", series: "driver_root.insurance", neutral: 0.0, until: 2029}   # проход ядра 7: ρ — LT 0, LT_from 2030

# ------------------------------------------------------------------ класс 6: центр суждения равен правилу устава
# Таблица устава §3 с правками решений ведущего № 1 и № 2: ключ книги → правило → допуск (устав §8: 1e-9; где книга пишет центр
# округлением листа — допуск равен половине единицы записи, с пометкой). ПРАВКА 21.10.2026 (решения ведущего № 2, В9): правила
# центров — ФОРМУЛАМИ ОТ ФАКТОВ (rule: facts, поле expr; F — узел файла фактов, Q — ряд кварталов, B — значение книги, mean, mid),
# а не числами книги: перевод суждения мостом считается из фактов моста, среднее окна — из файла фактов; у ключа года с
# квартальными ключами сравнивается среднее кварталов (book_expr). Числа, которых в файлах фактов нет (кварталы окна L на составе
# якоря, реальные ставки окон режимов, рост банка и сектора в окнах), стоят в формуле с источником.
# ПРАВКА 22.10.2026 (решения ведущего № 6, Р6-2, на класс; проверка экономики econ5-blind F4): «среднее окна R» в правилах —
# среднее с равным весом календарных кварталов, то есть среднее скользящих 4 кварталов: mean(roll4(ряд)) у квартальных отношений,
# mean(roll4r(числитель, знаменатель)) у потоков (сумма к сумме внутри 4 кварталов). Было — среднее или сумма к сумме за 9 кварталов
# 2024К2–2026К2 (второй квартал трижды). Экземпляры: уровень CoR нормы и rr окна R (ключи нормы), доля неконтролирующих; уровни
# расходов, комиссий и страхования — в листе вывода (window_stats); интенсивность окна R — факт сборщика (не правился, назван)
# ПРАВКА 22.10.2026 (решения ведущего № 8, Р8-1; ревизия класса 6 sweep8 «статистика окна не на той величине» — поток book8): все
# расхождения ревизии исправлены на класс правилами ниже — наклон «прочего» на строке ССПУ (узел misc_window.slope), доля
# неконтролирующих на периметре якоря, доля выплаты и налог на прибыли без разовых (формулой от фактов), связь страхования
# 0…0,74, базы комиссий и страхования на строках книги, веса М13 и доля франшизы страхования без финрасходов МСФО 17,
# интенсивность окна R по Р6-2 (факт сборщика перевыпущен), оси кризиса, дюрации ССПСД и CoR сквозь цикл, премии роста
# средств (новые правила; нужда — запись шага ends_need листа вывода) и кредитов (окно под ограничением — 12 мес.)
# ПРАВКА 28.10.2026 (решения ведущего № 11, раздел А — одна таблица типов на всю книгу; поток book11): у КАЖДОГО правила — поле type
# (тип центра: А — статистика окна Р6-2; Б — совместный подбор той же механикой, что ядро; В — середина диапазона прочтений без
# оценщика; Г — одно чистое наблюдение, ось 0 … двойное; Д — свидетельств нет, середина области; Е — конвенция семейства; не
# суждения — «факт» и «тождество»). Типы — по таблице обзора sweep11 (svcb-850-handoff/stage1/round11/sweep/types_table.csv).
# centre_types: true — инструмент судит: правило без типа и ось книги без правила-суждения с типом (ключ правила — путь оси или
# правило судит конец оси) — находка класса 6 («ключ с центром или осью без типа — красный»). Ключи phi_share (Р11-1) — после
# прохода ядра 9 (интегратор: тип Б).
# ПРАВКА 28.10.2026 (проверка исполнения круга 11; поток fix11): инструмент судил только оси — ключи с центром без оси (метка
# суждения [В…] / [Р/В…] в комментарии ключа шаблона, centre_template) теперь тоже: ключ без правила с типом — находка класса 6
centre_types: true
centre_template: data/assumptions/assumptions_template.yaml
centres:
  - {key: nii.nim_lt_target_mgmt, rule: facts, type: "Б", expr: "(mid(0.0713, 0.0721) * (F('bridge_mgmt_ifrs', 'nim', 'history')[-1]['gap_iea_x4']['v'] * 365 / (4 * F('nii_books', 'days'))) - (B('nii.books.insurance_liab.beta') * B('worlds.N.key_rate')['2036H2'] + B('nii.books.insurance_liab.spread.LT')) * (F('balance', 'insurance', 'contract_liabilities') / F('balance', 'iea'))) / F('bridge_mgmt_ifrs', 'nim', 'value')", tol: 5e-07, source: "устав §3, решения № 1 п. 1: середина кварталов окна L на составе якоря 7,13 / 7,21 % опр. банка точным мостом (банк × R − ife_N × l_ins) / b — R, l_ins, b из фактов; β и спред книги страховых, ключевая мира N — книги"}
  - {key: nii.transmission.target, rule: facts, type: "В", expr: "mid(-0.15, 0.03) * (F('bridge_mgmt_ifrs', 'nim', 'history')[-1]['gap_iea_x4']['v'] * 365 / (4 * F('nii_books', 'days'))) - B('nii.books.insurance_liab.beta') * (F('balance', 'insurance', 'contract_liabilities') / F('balance', 'iea'))", tol: 5e-07, source: "устав §3: середина регрессий −0,15…+0,03 опр. банка × R − β_ins × l_ins (факты моста)"}
  # ---- Р3 (решения ведущего № 3; итог скептика econ-blind № 1, класс 6): CoR режимов — на составе якоря. Центр ключа =
  #      (уровень своего окна + κ × (rr мира M года ключа − rr окна)) / I окна; I — середина двух источников (датабук,
  #      МСФО), узел фактов credit_products.intensity.<окно>.mid. Правила I — ниже, формулами от рядов того же файла.
  - {key: regimes.soft.cor.2026, rule: facts, type: "Г", expr: "(Q('mgmt_quarterly', 'cor_exact', '2026Q2', '2026Q2')[0]) / F('credit_products', 'intensity', 'q2_2026', 'mid')", tol: 5e-05, source: "решения № 2, А5: 2-й квартал 2026 года (нау-каст, без переноса); ÷ I окна q2_2026 (Р3)"}
  - {key: regimes.soft.cor.2027, rule: facts, type: "В", expr: "(mid(Q('mgmt_quarterly', 'cor_exact', '2026Q2', '2026Q2')[0], mid(0.014, 0.019)) + (B('credit.kappa') * F('credit_products', 'intensity', 'R', 'mid')) * (mid(B('worlds.M.real_key')['2027H1'], B('worlds.M.real_key')['2027H2']) - 0.04517250) / 2) / F('credit_products', 'intensity', 'soft', 'mid')", tol: 5e-05, source: "лист pnl: середина пути 2К2026 → центр благоприятного класса 1,65 %, перенос κ — половина (середина ключа 2026 без переноса и 2028 с переносом, b5_transfer.json drr 2027 = Δrr / 2); запись уровня 4 знака; ÷ I окна soft (Р3); Р11-9 (поток fix11): rr класса без 2018 (Росевробанк — эффект покупки не раскрыт): 2017, 2019, 2023 — 4,517 (было 4,468 с 2018); подтверждено решениями № 12, раздел Д: пути CoR и κ без 2016 и 2018 годов — по Р11-9 (−0,36 / −0,36)"}
  - {key: regimes.soft.cor.2028, rule: facts, type: "В", expr: "(mid(0.014, 0.019) + (B('credit.kappa') * F('credit_products', 'intensity', 'R', 'mid')) * (mid(B('worlds.M.real_key')['2028H1'], B('worlds.M.real_key')['2028H2']) - 0.04517250)) / F('credit_products', 'intensity', 'soft', 'mid')", tol: 1e-06, source: "устав §3: благоприятный класс 1,4–1,9 % (rr 4,47); ÷ I окна soft (Р3); Р11-9 (поток fix11): rr класса без 2018 — 2017, 2019, 2023: 4,517 (было 4,468); уровень класса 1,4–1,9 % (годы 1,70 / 1,37 / 1,94) не меняется; подтверждено решениями № 12, раздел Д: пути CoR и κ без 2016 и 2018 годов — по Р11-9 (−0,36 / −0,36)"}
