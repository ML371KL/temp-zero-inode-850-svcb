# Проверки классов ошибок в модели (PLAYBOOK семейства, §2а) — книга Совкомбанка 0.1 (фаза 3, 21.10.2026): законные связи,
# допуски, перечень переходных слагаемых и правила центров. Читает ops/tools/class_checks.py (и блоком — ops/tools/rederive.py);
# ядро этот файл не читает, числа модели от него не зависят.
#
# Источник — устав калибровки Совкомбанка §8 (svcb-850-handoff/notes/CALIBRATION-CHARTER.md) с правками решений ведущего № 1
# (notes/LEAD-DECISIONS-1.md). Срабатывание проверки — находка для перепроверки, а не повод подгонять модель или этот файл:
# допуск и связь меняются только решением устава с причиной.
status: "устав Совкомбанка §8, решения ведущего № 1, № 2, № 3, № 4 (21.10.2026), № 5–№ 9 (22.10.2026), № 10, № 11, № 12 (28.10.2026)"

# ------------------------------------------------------------------ класс 1: капитал и баланс сходятся
identities:
  rel_tol: 1.0e-9          # устав §8: тождества капитала и баланса — допуск 1e-6 млрд ₽ (арифметика); относительная невязка ядра 1e-9 строже
  at_axis_ends: true       # тождества — и на обоих концах каждой оси полосы

# ------------------------------------------------------------------ класс 2: числа одной клетки не переносятся на другие
cross_cell:
