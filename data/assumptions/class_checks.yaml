  # режимов общие (обучение A-P2u); решение передачи — на мирах уровня и опоры. Выкуп по цене мира (М3, с 21.10.2026): путь акций,
  # делитель и дивиденд — своей клетки; законная связь «кривая мира — цена выкупа клеток мира» входит в связь world (клетки
  # одного мира делят k мира, а с ним — форвард цены выкупа).
  legal_links:
    world: "клетки одного мира читают его путь ставок, роста сектора, цен и дисконт (М§3.1), а с дисконтом — форвард цены выкупа (М§5.6)"
    regime: "клетки одного режима читают его пути CoR, ЧПМ, роста и множитель RWA (М§3.2)"
    scenario: "клетки одного сценария капитала читают его надбавки, вычеты и глиссаду (М§3.3, §4.13)"
    a_p2u: "обучение режимов A-P2u: ожидание режима — среднее слоя по клеткам режима, отклонения δ несут клетки режима (М§12)"
    transmission: "решение передачи ставки σ0, φ — на мирах уровня (N) и опоры (H), сдвиг и сжатие несут все миры (М§4.5)"
    reference_world: "мир-опора передачи H: его опорные ставки входят в сжатие φ и разность X_W,q всех миров (М§4.4)"
    kappa_reference_world: "мир-опора κ-добавки M: его реальная ставка — опора добавки CoR всех миров (М§4.6)"
