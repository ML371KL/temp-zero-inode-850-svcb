                                                               #   ряд ф. 0409135 01.01.2025–01.09.2026 против требования в силе: 0.41…1.39 п.п.
                                                               #   (минимум 01.04.2025: 9,41 % при 9,0 %; максимум 01.09.2026: 11,39 % при 10,0 %); правило устава — середина;
