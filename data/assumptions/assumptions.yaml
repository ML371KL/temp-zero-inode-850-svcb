    # отчётная дата 01.04.Y — первая проверка ступени по 220-И; отчётная дата 01.01.Y остаётся под ключом года Y−1. Поэтому
    # ключ года = «с проверки 1 апреля» без сдвига на квартал: сдвиг дал бы лишний квартал отсрочки. Заблаговременный набор
