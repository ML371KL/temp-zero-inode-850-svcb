                                                               #   до записи плотностей 4 знаками, разница 6e-7 > допуска правила класса 6]; прочие статьи денег — вес 0. На концах оси
                                                               #   CCF — тем же правилом при масштабе конца
    density_drift_rate: -0.0145                               # рост плотности, доля в год [В: Плотность RWA банка 2025–2026 годов при составе якоря: −2,9 % в год]
                                                               #   индекс RWA банка / RWA на плотностях якоря: 1,037 (2К2025, после присоединения ХКФ) → 0,999 (2К2026),
                                                               #   лог-регрессия -2.9 % в год
                                                               # ПРАВКА 28.10.2026 (решения ведущего № 11, Р11-4; тип В): свидетельства на той же величине — факт −2,9 % в
                                                               #   год и 0 (нет дрейфа); центр — середина −1,45 % (было −1,4 — середина, округлённая к нулю), ось −2,9…0
                                                               #   (было −2,9…+1,0: верх — суждение о макронадбавках, не свидетельство дрейфа). Макронадбавки к весам риска —
                                                               #   в сценариях требований, не в оси дрейфа; в сценариях требований книги их НЕТ (схема SCENARIO: надбавки
                                                               #   к нормативу и вычеты) — красный флаг потока book11, ключ не добавлен
    density_drift_until: 2027                                  # последний год дрейфа [В: как у Т и ВТБ; ПВР для СЗКО к 2030 году — ось после 2029 года, не центр]
    fx: {enabled: false, share: null, foreign_inflation: null} # валютная переоценка RWA выключена: курса в мирах нет [В]
    guarantees:                                                # К5 (решения ведущего № 3, Р7; М11; скептик Б8): RWA гарантий — отдельная сумма с драйвером =
                                                               #   база комиссий (К2: кредиты), вырезанная из плотности корпоративной книги (на якоре RWA тот же). G_0 = (1 029,2 × 0,425
                                                               #   + 137,7 × 1,0) × 1,1176 = 642,8 млрд ₽. Вариант guarantees_off — прежняя форма. Значения — svcb-850-handoff/stage1/round3/new_keys.yaml
      enabled: true
      notional: {nonfinancial: anchor, financial: anchor}      # [Ф: facts capital.guarantees — нефинансовые 1 029,221, финансовые
                                                               #   137,704 млрд ₽ (2026Q2_ifrs_fs.pdf, с. 21 и 43)]
      ccf: {nonfinancial: 0.425, financial: 1.0}               # [Ф: Номиналы гарантий — МСФО; коэффициент пересчёта — Инструкция 199-И] [Л/НП: 199-И — середина 0,35 … 0,5 без проверки первичкой (ось — сам
                                                               #   диапазон, в конце списка осей); финансовые — 1,0]
      weight: 1.0717                                           # вес риска 100 % × масштаб калибровки RWA книги (= плотность auto; Р4-11 — масштаб от CCF К5) [Р]
      carve_from: corp_loans                                   # книга выреза — корпоративный кредит (гарантии — франшиза КБ)
      driver: fees_component                                   # ИНТЕГРАЦИЯ КРУГА 5 (решения ведущего № 5, Р5-5; проход ядра 4; класс 1): драйвер G_q —
                                                               #   уровень базы КОМПОНЕНТЫ юрлиц смеси базы комиссий (fees.volume_base.mix.corporate: {corp_loans: 1}), а не вся смесь
                                                               #   (14,5 % — розница). Компонента = книга выреза, поэтому RWA ≡ К5 выключен (тождество М§4.11, G5); ряд rwa_guar
                                                               #   печатается. Было driver: fees_base — вариант guarantees_mix_driver
      component: corporate                                     # имя компоненты смеси fees.volume_base.mix (Р5-5)
  recapitalization: {enabled: false}                           # докапитализация не моделируется (модуль не реализован; SPO менеджмент исключает)
  growth_constraint:                                           # рост, ограниченный капиталом (MODEL §4.13) [В]
    enabled: true
    order: growth_first                                        # ПРАВКА 21.10.2026 (решения ведущего № 2, В1): «рост первым» — при нехватке капитала сначала уступает
                                                               #   дивиденд, рост урезается, когда не хватает и без дивиденда (MODEL §4.13). Факты 2024–2026: банк держал
                                                               #   рост (RWA +33 % и +19 %), урезая выплату до жетона (10–16 % прибыли), и запустил выкуп. Справочно:
                                                               #   «как Т» (dividend_first) — развилка сухим перевыводом (Р10-15; вариант closure_as_t снят); «как Сбер» — файл
                                                               #   подмен probe_B_overrides.yaml (годовой календарь, без ограничения роста). М1 (годовое решение внутри
                                                               #   роста, жетон-минимум DPS) — после круга 2, если цена правила больше шага печати
    min_growth_scale: 0                                        # портфель не сжимается (у банка RWA −2 % за 8М2026 — схема ниже нуля не берёт)
    lookahead_quarters: 8                                      # ступени требования видны за 8 кварталов (как у Т)
    glide_pp_per_quarter: 0.00265                              # набор требования за квартал до ступени [Р/В: якорь на глиссаде: (12,9 − 10,985) / 7 = 0,274 п.п.;
                                                               #   темп набора банка 01.01→01.09.2026 — 0,32 п.п. за квартал]; требование с глиссадой на якоре 10,975 %
                                                               #   при факте 10,985 % (при 0,25 п.п., как у Т, — 11,15 %: нарушено уже на якоре)
                                                               #   ПРАВКА 28.10.2026 (поток fix11): запас 0,84 п.п. (тип А) → (12,84 − 10,985) / 7 = 0,265 п.п. (было 0,275 при
                                                               #   запасе 0,9); концы связки запаса 0,73 / 0,91 п.п. — 0,250 / 0,275 (правило «якорь на глиссаде», class_checks)
    catch_up_rate: 0.0                                         # навёрстывания урезанного роста нет (как у Т)
    tol: 0.0001

# ------------------------------------------------------------------ ДИВИДЕНДЫ — ПРОБА А «как Т» (dividends_block_A.yaml)
dividends:
  policy:                                                      # [Ф: Положение о дивидендной политике, версия 2.0, НС 20.11.2023, протокол № 29 (P/POLICY_dividend_v2_2023-11-20.pdf,
                                                               #   пп. 5.2–5.3): 25–50 % чистой прибыли по МСФО, не реже раза в год, Н1.0 банка после выплаты ≥ 11,5 %];
                                                               #   редакция 07–08.10.2026 (неденежная форма) — текст не найден [НП]
    name: "Положение о дивидендной политике ПАО «Совкомбанк» (версия 2.0, НС 20.11.2023)"
    base: ifrs_ni_shareholders                                 # прибыль МСФО акционерам банка до купонов бессрочных (48,910 за 2025 год) — база ядра; у банка база —
                                                               #   «чистая прибыль по МСФО» (вся, 53,232): доля ко всей ≈ доле к акционерам (14,8 и 16,1 % за 2025 год;
                                                               #   середины после IPO 20,1 и 20,3 %) — центр 20 % один в обеих базах (лист sheets/dividend_facts.csv)
    deduct_at1_after_tax: false                                # купон бессрочных из базы не вычитается: факты выплат считаются от 48,910 (до купонов)
    payout: {"2026": 0.22069, "2027": 0.22069, LT: 0.22069, LT_from: 2028}
                                                               # ПОМЕТКА 21.10.2026 (решения ведущего № 3, Р14): центр 20 % — ИЗ ОКНА ПОД ОГРАНИЧЕНИЕМ капитала (2024–2025: выплата
                                                               #   10–16 % при Н1.0 на запасе менеджмента и росте RWA +33 / +19 %; политика 25–50 % при Н1.0 ≥ 11,5 % не соблюдалась)
                                                               # ПРАВКА 21.10.2026 (проход ядра 1, М3): 0,20 × N_iss / N_дивиденда = 0,20 × 22 516,229 / 22 446,049 = 0,20063 —
                                                               #   без множителя пути выкупа: дивиденд на акции дочки ядро считает по пути акций своей клетки N_c,q само
                                                               #   [Р: решения № 1, п. 11 в форме М3; new_keys.yaml]. Прежний текст (ключ с множителем пути выкупа):
                                                               # [В: Выплата 2023–2025 годов — 10–30 % прибыли акционерам; середина 20 %]
                                                               #   ЦЕНТР 20 % ЮРИДИЧЕСКОГО дивиденда к прибыли акционерам (10,4 / 16,1 / 30,3 % за 2024 / 2025 / 2023 с промежуточными;
                                                               #   до IPO 13–27 %; ось 10–30 % — dividends.payout_deviation). Ключ ядра — доля, уменьшающая капитал: пул ядра —
                                                               #   на размещённые акции, BV уменьшается на пул × N_out / N_iss с N_out фактов якоря (22 431,1 млн), а
                                                               #   дивиденд на акции страховой дочки остаётся в группе. Ключ = 0,20 × N_out(решение) × N_iss /
                                                               #   (N_дивиденда × N_out якоря): N_дивиденда = выпущено − у банка 70,18 = 22 446,05 млн (7 856 117 007,20 ₽ / 0,35);
                                                               #   N_out(решение) — по пути выкупа (решения 2К2027 / 2К2028 / 2К2029: 21 341 / 20 154 / 19 560 млн). Связка
                                                               #   с выкупом (buyback_keys.yaml): без выкупа ключ 0,1988 (класс 1 — одно суждение в трёх ключах)
                                                               #   ПРАВКА 22.10.2026 (решения ведущего № 8, Р8-4; класс 1/6 — не та база прибыли): доля выплаты — на прибыли акционерам БЕЗ РАЗОВЫХ
                                                               #     (как налог, «прочее» и доля неконтролирующих; в прибыли модели разовых нет): 0,35 ₽ × 22 446,049 млн / (прибыль акционерам − Σ noncore_net
                                                               #     года) — 2024 13,57 % (с разовыми 10,4), 2025 21,97 % (с разовыми 16,1), 2023 30,3 % (разовых нет);
                                                               #     середина наблюдённого диапазона 21,93 % → 22 % (было 20 %); ключ 0,22 × 22 516,229 / 22 446,049 = 0.22069. Ось отклонения −0,084…0,083 — той же базой (лист stage1/round8/r8_book.py, payout)
    metric: n20_0
    threshold: 0.0                                             # порог 11,5 % политики — НЕ требование: Н1.0 ниже 11,5 % с 01.08.2024, а 0,35 ₽ платились в июле 2025 и
                                                               #   2026 года; требование = пол сценария + запас (с 2028 года 12,9 % > 11,5 %). Ступень доли «25 % при Н1.0 ≥ 11,5 %»
                                                               #   — только годовой режим (проба Б, справочный вариант policy_step_11_5)
    steps: []
    shortfall_rule: residual_above_requirement
    divisor: issued                                            # единственное значение схемы: DPS политики = пул / размещённые (22 516,2 млн); у банка — на акции в обращении на
                                                               #   дату решения без акций у самого банка (22 446,0 млн): разница 0,3 % — в ключе payout выше. Печать DPS ядра
                                                               #   (Div / N_out якоря) после выкупа занижена в N_out(решение) / N_out якоря раз: 0,95 (2027), 0,87 (с 2029) — флаг
    dps_rounding: half_up_kopeck                               # копейки (0,35 ₽); при history_test: none ключ не читается
    forecast_rounding: none
    history_test: none                                         # [В] политика задаёт диапазон 25–50 %, а не формулу; два года подряд ниже диапазона — тест не о чем;
                                                               #   ключа checks.payout_cap в книге быть не должно (отказ схемы при history_test ≠ cap)
    base_window_quarters: 1                                    # база пула — прибыль своего квартала: годовая сумма = доля × прибыль года
  payout_deviation: {LT: 0.0}                                  # добровольное отклонение доли [В: Выплата 2023–2025 годов — 10–30 % прибыли акционерам]
                                                               #   ось −10…+10 п.п. (доля 10–30 %) — устав, раздел 3
                                                               #   ПРАВКА 22.10.2026 (решения ведущего № 8, Р8-4): ось −8,4…8,3 п.п. — доля 13,6–30,3 % на прибыли без разовых, центр 22 %
  excess:
    from_profit_year: 2028                                     # выплата избытка над требованием — с прибыли 2028 года (решение 2К2029): после ступени 2028 года и конца
                                                               #   выкупа (2028К4) норма возврата капитала — дивиденд [В: устав, раздел 3, строка «выкуп»]
    epsilon: 0.5                                               # [В: Доля выплаты избытка: середина между историей (0) и капиталонейтральной (1)]
                                                               #   ось 0–1; правило семейства (книги Т и Сбера)
    ramp_years: 3                                              # ε/3, 2ε/3, ε за прибыль 2028, 2029, 2030 годов [В: как у Т и Сбера]
  crisis: {skip_in_shock_year: true, catch_up: false}          # год шока — 0 (2020: рекомендация ЦБ; 2022: убыток), догоняющей выплаты не было [Ф: F/svcb_dividends.csv]
  min_dps: {LT: 0.35}                                          # К1 (решения ведущего № 3, Р5; М1; условие В1 выполнено): жетон DPS за год прибыли, ₽ —
                                                               #   рост урезается до выплаты 0,35 ₽, если норматив после выплаты не ниже требования без запаса менеджмента [Ф: DPS за
                                                               #   2024 и 2025 годы — 0,35 и 0,35 ₽ (facts/dividends.json: history, register_seed)]; читается в машине роста (квартальный
                                                               #   календарь + growth_constraint). Вариант dividend_token_off — «рост первым» без жетона. Оси нет (правило поведения)
  buyback:                                                     # М3 (решения ведущего № 2, В5; проход ядра 1): выкуп акций страховой дочкой по цене мира — путь акций,
                                                               #   делитель и дивиденд своей клетки (класс 2); выкуп — распределение акционерам, не в совокупном доходе
    enabled: true
    amount: {"2026Q3": 2.0, "2026Q4": 3.0, "2027": 3.0, "2028": 3.0, "2029": 0.0, "2030": 0.0, "2031Q1": 0.0, "2031Q2": 0.0, "2031Q3": 0.0, "2031Q4": 0.0, LT: 0.0, LT_from: 2032}
                                                               # ПРАВКА 28.10.2026 (решения ведущего № 10, Р10-4 — правило осей; класс 6): центр тот же (3 млрд ₽/кв. до 2028К4);
                                                               #   нули 2029–2031 явными ключами — на них ось по сроку (ниже) ставит верх; LT 0 с 2032 года (было LT_from 2029)
                                                               # млрд ₽ за квартал [Ф/В: 2 млрд ₽/кв. с 22.06.2026, 3 млрд ₽/кв. с 07.10.2026 — Интерфакс и банк]
                                                               #   (Интерфакс 20.06.2026, банк 06.10.2026); до 2028К4 — устав §3, умолчание О3; за T выкупа нет. 3К2026 — 2,0:
                                                               #   квартал закрыт ставкой 2 млрд
    price: world_forward                                       # центр: форвард рыночной цены мира от цены книги 10,105 ₽ (рост k мира минус дивиденд) [решения № 2, В5]
                                                               #   ВНИМАНИЕ (проверка прохода ядра, флаг 1): при выкупе после 2028 года форвард уходит ниже нуля в мире N
                                                               #   (с 2032К3) — ядро отказывает; центр (до 2028К4) не затронут; ось и вариант «до конца сетки» — см. ниже
    closed_prices: {"2026Q3": 10.0557}                         # ₽: средняя цена закрытого квартала — VWAP ISS TQBR 01.07–30.09.2026 [Р; факт покупок дочки — МСФО 9М2026,
                                                               #   13.11.2026: перезаякоривание]
    skip_in_shock_year: false                                  # [В: выкуп «бессрочно», страховщик покупает за свои средства — в шок не отменяется]
  calendar:
    frequency: quarterly
    decision_lag_quarters: {"1": 4, "2": 4, "3": 3, "4": 2}    # решение за 2–4-й кв. — во 2К следующего года (ГОСА в июне), за 1-й — в 1К (схема: лаг ≤ 4) [Ф/В]
    reg_deduction_lag_quarters: 3                              # вычет из норматива: 1К→1К, 2К/3К→2К, 4К→3К следующего года [В]
    payment_lag_quarters: 3
    checkpoints_ahead: 0
    agm_quarter: null
    reg_deduction_quarter: null
    payment_quarter: null
    checkpoints: null

bridge:
